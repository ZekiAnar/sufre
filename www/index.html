<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a3263b">
<title>Süfrə</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
/* Layout idea: a phone-first app shell — header, one scrolling view, bottom tab bar; sheets slide up for a day or a recipe. */
:root{
  --bg:#f6f4f1; --surface:#ffffff; --ink:#1f2328; --muted:#5f6670; --line:#e3ded7;
  --accent:#a3263b; --saffron:#d99a1e; --herb:#3d7a4c; --sky:#2f6690;
  --accent-soft:#f5e3e6; --herb-soft:#e4efe6; --saffron-soft:#f8ecd2; --sky-soft:#e1ecf4;
  --good:#3d7a4c; --warn:#b7791f;
  --display:"Noto Serif", Georgia, serif;
  --body:"Noto Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --r:14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --surface:#1e2125; --ink:#eceae6; --muted:#a2a8b0; --line:#30353b;
    --accent:#e0566c; --saffron:#e8b04a; --herb:#6dbb80; --sky:#6aa6d6;
    --accent-soft:#3a2026; --herb-soft:#1f3326; --saffron-soft:#3a2f18; --sky-soft:#1c2a36;
    --good:#6dbb80; --warn:#e8b04a; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --surface:#1e2125; --ink:#eceae6; --muted:#a2a8b0; --line:#30353b;
  --accent:#e0566c; --saffron:#e8b04a; --herb:#6dbb80; --sky:#6aa6d6;
  --accent-soft:#3a2026; --herb-soft:#1f3326; --saffron-soft:#3a2f18; --sky-soft:#1c2a36;
  --good:#6dbb80; --warn:#e8b04a; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.5rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
a{color:var(--accent)}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;background:var(--bg)}
header.bar{padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:var(--bg)}
header.bar .brand{font-family:var(--display);font-weight:700;font-size:1.2rem;color:var(--accent);margin-right:auto}
.who{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.who::-webkit-scrollbar{display:none}
.who button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;white-space:nowrap;cursor:pointer}
.who button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
nav.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button:focus-visible,.btn:focus-visible,.chip:focus-visible,.ic:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.num{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{white-space:nowrap}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px}
.p-S{background:var(--saffron-soft)} .p-N{background:var(--herb-soft)} .p-D{background:var(--sky-soft)} .p-Q{background:var(--accent-soft)}
.ic{border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted)}
/* today */
.hero{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.ring{position:relative;width:120px;height:120px}
.ring svg{width:120px;height:120px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.1}
.datebig{font-family:var(--display);font-size:1.35rem;font-weight:700}
.meal{display:grid;grid-template-columns:auto 56px 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.meal.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.meal.done .mt{text-decoration:line-through;color:var(--muted)}
.meal .art{width:56px;height:44px} .meal .art svg{width:56px;height:44px}
.meal .mt{font-weight:600;line-height:1.25;cursor:pointer}
.meal .ms{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.check[aria-checked="true"]{background:var(--good);border-color:var(--good);color:#fff}
.water{display:flex;gap:6px;flex-wrap:wrap}
.water button{width:30px;height:38px;border:2px solid var(--sky);border-radius:4px 4px 9px 9px;background:transparent;cursor:pointer;padding:0;position:relative;overflow:hidden}
.water button[aria-pressed="true"]{background:var(--sky)}
.tipbox{border-left:4px solid var(--saffron);background:var(--saffron-soft);border-radius:8px;padding:10px 12px;font-size:.92rem}
.warnbox{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
/* calendar */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wkh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;font-size:.7rem;color:var(--muted);text-align:center;font-weight:600;margin-bottom:4px}
.dc{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 4px;min-height:64px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:.72rem;position:relative}
.dc .dn{font-weight:700;font-size:1rem;font-variant-numeric:tabular-nums}
.dc.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.dc.past{opacity:.7}
.dc.out{visibility:hidden}
.dc .dots{display:flex;gap:2px}
.dc .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dc .dots i.on{background:var(--good)}
.mlabel{font-family:var(--display);font-weight:700;margin:14px 0 8px}
/* recipes */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rc{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.rc .im{background:var(--bg);display:flex;justify-content:center;padding:6px 0;height:96px;align-items:center}
.rc .im svg{width:110px;height:80px} .rc .im img{width:100%;height:96px;object-fit:cover}
.rc .tx{padding:8px 10px}
.rc .tx b{display:block;font-size:.9rem;line-height:1.25}
.nat{color:var(--accent)}
.cu{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.04em;padding:1px 5px;border-radius:5px;color:#fff;background:var(--cu);vertical-align:middle}
input[type=search],input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
label.f{display:block;font-size:.82rem;font-weight:600;margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* sheet */
.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet .sh h2{flex:1;font-size:1.1rem}
.sheet .sb{overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
.hero-img{border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;justify-content:center;align-items:center;min-height:150px;overflow:hidden}
.hero-img svg{width:200px;height:146px} .hero-img img{width:100%;max-height:260px;object-fit:cover}
table.ing{width:100%;border-collapse:collapse;font-size:.92rem}
table.ing td{padding:6px 0;border-bottom:1px dashed var(--line);vertical-align:top}
table.ing td.g{text-align:right;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:10px}
ol.steps{padding-left:0;list-style:none;margin:0;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
ol.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.85rem}
ol.steps li.done{color:var(--muted);text-decoration:line-through}
ol.steps li.done::before{background:var(--good);color:#fff;content:"✓"}
.macros{display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-size:.9rem}
.macros b{font-weight:700}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:center}
ul.list{list-style:none;margin:0;padding:0}
.list li.got span:first-child{text-decoration:line-through;color:var(--muted)}
.list input[type=checkbox]{width:20px;height:20px;accent-color:var(--good);margin-right:8px;flex:none}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.9rem;z-index:50;max-width:90%}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.member{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.sec{margin-top:18px}
.welcome{max-width:520px;margin:20px auto;text-align:center}
.welcome h1{font-size:2rem;color:var(--accent)}
details summary{cursor:pointer;font-weight:600}
.alt{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.alt svg{width:56px;height:44px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

n.", "Yumurtaları birbaşa sousun üstünə sındırın. Yumurtanı ya bütöv saxlayın (qapaqlı, 3 dəqiqə), ya da yavaş-yavaş qarışdırıb 2 dəqiqə bişirin.", "Üstünə doğranmış göyərti səpin. Ağ pendir və 1 dilim çörəklə verin."], "tip": "Yağı ölçün: göz ilə tökülən yağ asanlıqla 2–3 qaşıq olur, bu da əlavə 150–250 kkal deməkdir.", "nat": true, "batch": null}, {"code": "S2", "cu": "az", "name": "İspanaq çığırtması", "meal": "S", "kind": "eggs", "min": 20, "ing": [["yumurta", 165, "3 ədəd"], ["ispanaq", 200, "1 böyük dəstə"], ["sogan", 70, "1 kiçik"], ["kere", 5, "1 çay qaşığı"], ["qatiq", 150, "yarım stəkan"], ["corek", 40, "1 dilim"]], "steps": ["İspanağı bol suda 2–3 dəfə yuyun, qum qalmasın. Qalın saplarını kəsib iri doğrayın.", "Soğanı yarımhalqa doğrayın, kərə yağında 4–5 dəqiqə şəffaflaşana qədər qovurun.", "İspanağı əlavə edin, qarışdıraraq 3–4 dəqiqə, həcmi azalıb suyu çəkilənə qədər bişirin. Duz və istiot vurun.", "Qaşıqla 3 çuxur açın, yumurtaları sındırın. Qapağı bağlayıb zəif odda 4–5 dəqiqə bişirin.", "Qatığa 1 diş əzilmiş sarımsaq qatıb sarımsaqlı qatıq hazırlayın. Çığırtmanı qatıq və çörəklə verin."], "tip": "Qışda dondurulmuş ispanaq da olar: əvvəlcə tavada suyunu çəkdirin.", "nat": true, "batch": null}, {"code": "S3", "cu": "az", "name": "Kəsmikli-göyərtili lavaş dürməyi", "meal": "S", "kind": "wrap", "min": 10, "ing": [["lavas", 60, "1 böyük vərəq"], ["kesmik", 180, "1 qutu"], ["goyerti", 40, "yarım dəstə"], ["pomidor", 120, "1 pomidor"], ["xiyar", 100, "1 xiyar"], ["qoz", 10, "2 ləpə"]], "steps": ["Göyərtini (keşniş, şüyüd, reyhan, yaşıl soğan) yuyub qurulayın və çox xırda doğrayın.", "Kəsmiyi çəngəllə əzin, göyərti, bir çimdik duz və istiotla qarışdırın. Qozu bıçaqla xırdalayıb əlavə edin.", "Lavaşı yayın, kəsmik qarışığını bərabər çəkin, üstünə nazik doğranmış pomidor və xiyar düzün.", "Möhkəm bükün, ortadan çəp kəsin. Quru tavada hər tərəfi 1 dəqiqə qızdırsanız daha dadlı olur."], "tip": "İşə aparmaq üçün folqaya bükün, soyuq halda da yaxşıdır.", "nat": t const GOALS={lose:'Arıqlamaq',light:'Yüngül arıqlamaq',keep:'Çəkini saxlamaq',gain:'Çəki almaq'};
const bmr=m=>10*m.w+6.25*m.h-5*m.age+(m.sex==='m'?5:-161);
const tdee=m=>bmr(m)*m.act;
function target(m){
  const t=tdee(m); let d=0;
  if(m.goal==='lose') d=Math.min(t*0.25,600);
  else if(m.goal==='light') d=Math.min(t*0.15,300);
  else if(m.goal==='gain') d=-300;
  if(m.anemia&&d>350) d=350;
  if(m.age<18&&d>200) d=200;
  const floor=m.sex==='m'?1500:1200;
  return Math.round(Math.max(floor,t-d));
}
const bmi=m=>m.w/((m.h/100)**2);

const TAGS={baliq:['ag_baliq','kutum'],ciyer:['ciyer'],quzu:['quzu'],mal:['mal_eti','mal_qiyme'],toyuq:['toyuq_file','toyuq_bud','toyuq_qiyme'],sud:['qatiq','kefir','sud','kesmik','ag_pendir','holland','xama','kere'],yumurta:['yumurta'],qoz:['qoz','findiq','badam'],gluten:['un','vermisel','bulqur','corek','lavas']};
const TAGN={baliq:'Balıq',ciyer:'Ciyər',quzu:'Quzu əti',mal:'Mal əti',toyuq:'Toyuq',sud:'Süd məhsulları',yumurta:'Yumurta',qoz:'Qoz-fındıq',gluten:'Un və çörək (qlüten)'};
const kc=(c,g)=>ING[c].k*g/100;
function core(r,c){const tot=r.ing.reduce((a,[x,g])=>a+kc(x,g),0); const i=r.ing.findIndex(x=>x[0]===c); const share=kc(c,r.ing[i][1])/tot; return i<2||share>=0.25;}
function exclSet(){const s=new Set(); (S.prefs.excl||[]).forEach(t=>(TAGS[t]||[]).forEach(c=>s.add(c))); return s;}
function okExcl(r){ const ex=exclSet(); return !r.ing.some(([c])=>ex.has(c)&&core(r,c)); }
function eligible(r){ return okExcl(r)&&(r.cu==='all'||S.prefs.cuisines.includes(r.cu)); }
const INS_MUL={bal:0,quru_erik:0,kartof:0.5,duyu:0.6,lavas:0.6,corek:0.6,un:0.7,vermisel:0.7,nar:0.5,banan:0,xurma:0};
// adjusted ingredient list (base grams, before portion factor) for a member
const ADJ_CACHE=new Map();
function adj(code,m){
  const key=code+'|'+(m?m.id+(m.insulin?'i':''):'')+'|'+(S.prefs.excl||[]).join(',');
  if(ADJ_CACHE.has(key)) return ADJ_CACHE.get(key);
  const r=R[code], ex=exclSet(), notes=[]; let ing=[]; let reduced=false;
  r.ing.forEach(([c,g,h])=>{
    if(ex.has(c)){ notes.push(ING[c].n+' çıxarılıb (istisna)'); return; }
    let mul=1;
    if(m&&m.insulin&&c in INS_MUL){ mul=INS_MUL[c]; }
    if(mul===0){
      if(c==='banan'||c==='xurma'){ ing.push(['alma',Math.round(g*0.75),'']); notes.push(ING[c].n+' əvəzinə alma'); }
      else notes.push(ING[c].n+' çıxarılıb');
      reduced=true; return;
    }
    if(mul<1){ notes.push(ING[c].n+' '+(mul===0.5?'yarıya endirilib':'azaldılıb')); reduced=true; }
    ing.push([c,g*mul,mul===1?h:'']);
  });
  if(reduced&&(r.meal==='N'||r.meal==='D')){ ing.push(['pomidor',80,'salat']); ing.push(['xiyar',80,'salat']); notes.push('yanına pomidor-xiyar salatı əlavə olunub'); }
  const v={ing,notes,k:0,p:0,f:0,c:0};
  ing.forEach(([c,g])=>{v.k+=ING[c].k*g/100;v.p+=ING[c].p*g/100;v.f+=ING[c].f*g/100;v.c+=ING[c].c*g/100;});
  ADJ_CACHE.set(key,v); return v;
}
// per-member factor for a plan day
function dayInfo(i,m){
  const day=S.plan[i]; let k=0;
  MEALS.forEach(x=>k+=adj(day[x],m).k);
  let f=target(m)/k; f=Math.min(1.5,Math.max(0.5,f));
  const out={f,k:k*f,p:0,fat:0,c:0};
  MEALS.forEach(x=>{const a=adj(day[x],m); out.p+=a.p*f; out.fat+=a.f*f; out.c+=a.c*f;});
  return out;
}
const r5=g=>Math.max(5,Math.round(g/5)*5);

/* ================= plan generation ================= */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function isDefaultPrefs(){const c=S.prefs.cuisines; return c.length===1&&c[0]==='az'&&!S.prefs.quick&&!(S.prefs.excl||[]).length&&S.seed===1;}
const baseK=code=>R[code].ing.reduce((a,[c,g])=>a+kc(c,g),0);
function dayCuisines(){
  const sel=S.prefs.cuisines.length?S.prefs.cuisines:['az']; const out=[];
  const others=sel.filter(c=>c!=='az');
  for(let d=0;d<PLAN_DAYS;d++){
    if(sel.length===1) out.push(sel[0]);
    else if(sel.includes('az')) out.push(d%2===0?'az':others[Math.floor(d/2)%others.length]);
    else out.push(sel[d%sel.length]);
  }
  return out;
}
// choose S,N,D,Q for one day of cuisine cu
function pickDay(cu,d,ctx,rnd,keepQ){
  const pool=m=>{ let p=D.rec.filter(r=>r.meal===m&&okExcl(r)&&(m==='Q'?(r.cu==='all'||S.prefs.cuisines.includes(r.cu)||r.cu===cu):r.cu===cu)); if(!p.length) p=D.rec.filter(r=>r.meal===m&&okExcl(r)&&(r.cu==='az'||r.cu==='all')); return p; };
  const Sp=pool('S').concat(D.rec.filter(r=>r.meal==='S'&&okExcl(r)&&r.cu!==cu&&S.prefs.cuisines.includes(r.cu)));
  const Np=pool('N'), Dp=pool('D'), Qp=keepQ?[R[keepQ]]:pool('Q');
  const wd=parseISO(addDays(S.prefs.start,d)).getDay(); const weekday=wd>=1&&wd<=5;
  const cnt=ctx.cnt, last=ctx.last; let best=null,bs=1e9;
  for(const s of Sp) for(const n of Np) for(const dd of Dp) for(const q of Qp){
    let sc=Math.abs(baseK(s.code)+baseK(n.code)+baseK(dd.code)+baseK(q.code)-1910)/15;
    sc+=((cnt[s.code]||0)+(cnt[n.code]||0)+(cnt[dd.code]||0))*5+(cnt[q.code]||0)*3;
    if(s.cu!==cu) sc+=12;
    if(last.S.slice(-2).includes(s.code)) sc+=40;
    if(last.N.slice(-3).includes(n.code)) sc+=60;
    if(last.D.slice(-3).includes(dd.code)) sc+=60;
    if(!keepQ&&last.Q.slice(-1).includes(q.code)) sc+=15;
    if(n.kind===dd.kind) sc+=20;
    if(S.prefs.quick&&weekday&&(n.min>45||dd.min>45)) sc+=80;
    sc+=rnd()*6;
    if(sc<bs){bs=sc;best={S:s.code,N:n.code,D:dd.code,Q:q.code,cu};}
  }
  return best;
}
function generate(){
  ADJ_CACHE.clear();
  if(isDefaultPrefs()){ S.plan=D.basePlan.map(d=>({...d,cu:'az'})); return; }
  const rnd=rng(S.seed*9973+7), cus=dayCuisines();
  const ctx={cnt:{},last:{S:[],N:[],D:[],Q:[]}}, plan=[];
  for(let d=0; d<PLAN_DAYS; d++){
    const best=pickDay(cus[d],d,ctx,rnd);
    plan.push(best); MEALS.forEach(m=>{ctx.cnt[best[m]]=(ctx.cnt[best[m]]||0)+1; ctx.last[m].push(best[m]);});
  }
  S.plan=plan;
}
function setDayCuisine(i,cu){
  const ctx={cnt:{},last:{S:[],N:[],D:[],Q:[]}};
  S.plan.forEach((d,k)=>{ if(k===i) return; MEALS.forEach(m=>ctx.cnt[d[m]]=(ctx.cnt[d[m]]||0)+1); });
  for(let k=Math.max(0,i-3);k<i;k++) MEALS.forEach(m=>ctx.last[m].push(S.plan[k][m]));
  const p=pickDay(cu,i,ctx,rng(Date.now()%100000),S.plan[i].Q);
  S.plan[i]={...p,Q:S.plan[i].Q,cu};
}

/* ================= day helpers ================= */
const dayIdx=dateISO=>diffDays(S.prefs.start,dateISO);
const planIdx=dateISO=>{const i=dayIdx(dateISO); if(i<0) return -1; return i%PLAN_DAYS;};
function log(mid,date){S.log[mid]=S.log[mid]||{}; return S.log[mid][date]=S.log[mid][date]||{e:{},w:0,x:[]};}
function getLog(mid,date){return (S.log[mid]||{})[date]||{e:{},w:0,x:[]};}
function eatenK(m,date){
  const i=planIdx(date); if(i<0) return 0; const L=getLog(m.id,date), di=dayInfo(i,m); let k=0;
  MEALS.forEach(x=>{ if(L.e[x]) k+=adj(S.plan[i][x],m).k*di.f; });
  (L.x||[]).forEach(e=>k+=+e.k||0); return k;
}
function streak(m){
  let n=0, d=todayISO();
  const full=date=>{const L=getLog(m.id,date); return MEALS.every(x=>L.e[x]);};
  if(!full(d)) d=addDays(d,-1);
  while(dayIdx(d)>=0&&full(d)){n++; d=addDays(d,-1);}
  return n;
}
function nextMeal(){
  const now=new Date(), mins=now.getHours()*60+now.getMinutes();
  const t=S.prefs.times; let pick=null;
  for(const x of MEALS){const [h,mm]=t[x].split(':').map(Number); if(h*60+mm+60>=mins){pick=x;break;}}
  return pick;
}

function swapMeal(date,i,x,parent){
  const m=member(), cur=S.plan[i][x];

  const alts=D.rec.filter(r=>r.meal===x&&r.code!==cur&&okExcl(r)).sort((a,b)=>((a.cu===dcu||a.cu==='all')?0:1)-((b.cu===dcu||b.cu==='all')?0:1)||Math.abs(adj(a.code,m).k-adj(cur,m).k)-Math.abs(adj(b.code,m).k-adj(cur,m).k));
  openSheet(MEALS_SHORT[x]+' üçün alternativ',`<div class="stack">${alts.map(r=>`<button class="alt" data-c="${r.code}"><span>${photoOrArt(r)}</span><span>${cuTag(r.cu)} <b>${esc(r.name)}</b><br><span class="small muted">${fmt(adj(r.code,m).k)} kkal (əsas porsiya) · ${r.min} dəq</span></span><span class="muted">›</span></button>`).join('')}</div>`,(sb,w)=>{
    sb.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.plan[i][x]=b.dataset.c; save(); closeSheet(w); if(parent) closeSheet(parent); openDay(date); toast('Yemək dəyişdirildi');});
  });
}

/* ================= RECIPE sheet ================= */
function photoOrArt(r){ return PH[r.code]?`<img src="${PH[r.code]}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:8px">`:art(r.kind); }
const STEPDONE={};
function relevantSubs(r){const names=r.ing.map(([c])=>ING[c].n.toLowerCase()); return D.subs.filter(s=>names.some(n=>n.startsWith(s[0].toLowerCase().split(' (')[0].split(',')[0])||s[0].toLowerCase().startsWith(n.split(' (')[0])));}
function openRecipe(code,scope){
  const r=R[code], m=member(); scope=scope||'me';
  const a=adj(code,m);
  // member's typical factor = target / avg day kcal
  const avgF=(()=>{let s=0;for(let i=0;i<PLAN_DAYS;i++) s+=dayInfo(i,m).f; return s/PLAN_DAYS;})();
  let rows;
  const showH=Math.abs(avgF-1)<0.08;
  if(scope==='me') rows=a.ing.map(([c,g,h])=>[c,g*avgF,showH?h:'']);
  else{ const acc={},ord=[]; S.members.forEach(mm=>{let f=0;for(let i=0;i<PLAN_DAYS;i++) f+=dayInfo(i,mm).f; f/=PLAN_DAYS; adj(code,mm).ing.forEach(([c,g])=>{if(!(c in acc)){acc[c]=0;ord.push(c);} acc[c]+=g*f;});}); rows=ord.map(c=>[c,acc[c],'']); }
  const health=[];
  if(a.notes.length) health.push('<b>Sizin porsiyanızda:</b> '+esc(a.notes.join('; '))+'.');
  if(m.anemia&&r.ing.some(([c])=>['ciyer','mal_eti','mal_qiyme','quzu','merci','ispanaq','lobya_qirmizi','yumurta'].includes(c))) health.push('<b>Anemiya:</b> bu yemək dəmir verir. Limon sıxın və ya bibərli salatla yeyin, çayı 1–2 saat sonra için.');
  const subs=relevantSubs(r);
  const sd=STEPDONE[code]=STEPDONE[code]||{};
  const famN=S.members.length>1;
  openSheet(r.name,`<div class="stack">
    <div class="hero-img" id="himg">${PH[code]?`<img src="${PH[code]}" alt="${esc(r.name)}">`:art(r.kind)}</div>
    <div class="row between"><span class="small muted">${MEALS_SHORT[r.meal]} · ${r.min} dəq${CUIS[r.cu]?' · '+cuTag(r.cu)+' '+CUIS[r.cu][0]+' mətbəxi':''}</span>
      <label class="btn plain sm" for="ph">${PH[code]?'Şəkli dəyiş':'Şəkil əlavə et'}</label><input id="ph" type="file" accept="image/*" hidden></div>
    <div class="macros"><span><b>${fmt(a.k*avgF)}</b> kkal</span><span><b>${fmt(a.p*avgF)} q</b> zülal</span><span><b>${fmt(a.f*avgF)} q</b> yağ</span><span><b>${fmt(a.c*avgF)} q</b> karb.</span><span class="muted">${esc(m.name)}, 1 porsiya</span></div>
    ${r.batch?`<div class="tipbox">Bu yeməyi ${r.batch} porsiyalıq bişirib saxlamaq olar.</div>`:''}
    ${health.length?`<div class="warnbox">${health.join('<br>')}</div>`:''}
    <div class="row between"><h3>Ərzaq</h3>${famN?`<div class="chips"><button class="chip" data-sc="me" aria-pressed="${scope==='me'}">Mənim porsiyam</button><button class="chip" data-sc="fam" aria-pressed="${scope==='fam'}">Ailə qazanı</button></div>`:''}</div>
    <table class="ing"><tbody>${rows.map(([c,g,h])=>`<tr><td>${esc(ING[c].n)}${h&&scope==='me'?` <span class="muted small">· ${esc(h)}</span>`:''}</td><td class="g">${c==='yumurta'&&!(h&&scope==='me')?fmt1(Math.round(g/55*2)/2)+' ədəd · ':''}${r5(g)} q</td></tr>`).join('')}</tbody></table>
    ${scope==='fam'?`<p class="tiny muted">${S.members.length} nəfər üçün ümumi miqdar. Hər kəsin porsiyası öz profilindədir.</p>`:''}
    <h3>Hazırlanması</h3>
    <p class="tiny muted">Bitirdiyiniz addıma toxunun, üstündən xətt çəkiləcək.</p>
    <ol class="steps">${r.steps.map((s,j)=>`<li data-st="${j}" class="${sd[j]?'done':''}">${esc(s)}</li>`).join('')}</ol>
    ${r.tip?`<div class="tipbox">${esc(r.tip)}</div>`:''}
    ${subs.length?`<details class="card"><summary>Tapılmasa nə ilə əvəz etmək olar</summary><ul class="list">${subs.map(s=>`<li><span><b>${esc(s[0])}</b> → ${esc(s[1])}<br><span class="tiny muted">${esc(s[2])}</span></span></li>`).join('')}</ul></details>`:''}
  </div>`,(sb,w)=>{
    sb.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{closeSheet(w); openRecipe(code,b.dataset.sc);});
    sb.querySelectorAll('[data-st]').forEach(li=>li.onclick=()=>{const j=+li.dataset.st; sd[j]=!sd[j]; li.classList.toggle('done',sd[j]);});
    sb.querySelector('#ph').onchange=e=>{const f=e.target.files[0]; if(f) setPhoto(code,f,()=>{closeSheet(w); openRecipe(code,scope);});};
  });
  if(!PH[code]&&DB&&UID){ DB.doc('data/users/'+UID+'/photo-'+code).get().then(s=>{ if(s.exists){const d=s.data(); if(d&&d.img){PH[code]=d.img; try{localStorage.setItem(LSP,JSON.stringify(PH));}catch(e){} const h=document.getElementById('himg'); if(h) h.innerHTML=`<img src="${d.img}" alt="">`;}} }).catch(()=>{}); }
}
function setPhoto(code,file,done){
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{
    const max=640, sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const data=c.toDataURL('image/jpeg',0.72); URL.revokeObjectURL(url);
    PH[code]=data; try{localStorage.setItem(LSP,JSON.stringify(PH));}catch(e){toast('Cihazda yer azdır, şəkil yalnız indilik göstərilir');}
    if(DB&&UID) DB.doc('data/users/'+UID+'/photo-'+code).set({img:data}).catch(()=>{});
    toast('Şəkil əlavə olundu'); done&&done();
  };
  img.onerror=()=>{toast('Şəkli açmaq alınmadı');};
  img.src=url;
}

  }

function amount(code,g){
  if(code==='yumurta') return Math.ceil(g/55)+' ədəd';
  if(['sud','kefir'].includes(code)) return fmt1(Math.ceil(g/100)/10)+' l';
  if(g>=1000) return fmt1(Math.ceil(g/100)/10)+' kq';
  return (Math.ceil(g/10)*10)+' q';
}
function shopGroups(w,scope){
  const tot={}, mem=scope==='me'?[member()]:S.members;
  for(let k=0;k<7;k++){ const i=(w*7+k)%PLAN_DAYS; mem.forEach(m=>{const di=dayInfo(i,m); MEALS.forEach(x=>adj(S.plan[i][x],m).ing.forEach(([c,g])=>{tot[c]=(tot[c]||0)+g*di.f;}));}); }
  const groups={}; Object.entries(tot).forEach(([c,g])=>{if(g<1) return; const gr=ING[c].g; (groups[gr]=groups[gr]||[]).push([c,g]);});
  Object.values(groups).forEach(a=>a.sort((x,y)=>y[1]-x[1]));
  return groups;
}
function renderShop(){
  const t=todayISO(); const i=Math.max(0,dayIdx(t));

    ${S.members.length>1?`<div class="chips"><button class="chip" data-s="fam" aria-pressed="${shopScope==='fam'}">Bütün ailə (${S.members.length} nəfər)</button><button class="chip" data-s="me" aria-pressed="${shopScope==='me'}">Yalnız ${esc(member().name)}</button></div>`:''}
    <div class="row between"><span class="small muted">${got} / ${all.length} alınıb</span><button class="btn plain sm" id="copy">Kopyala</button></div>

    <p class="tiny muted">Profillərdəki xüsusi dəyişikliklər (məsələn, insulin direnci üçün azaldılmış kartof və ya istisna olunan ərzaq) nəzərə alınıb. Duz, ədviyyat və sarımsaq siyahıda yoxdur.</p>
  </div>`;
  view.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{shopWeek=+b.dataset.w; renderShop();});
  view.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{shopScope=b.dataset.s; renderShop();});
  view.querySelectorAll('[data-c]').forEach(cb=>cb.onchange=()=>{S.bought[key]=S.bought[key]||{}; S.bought[key][cb.dataset.c]=cb.checked; save(); renderShop();});
  document.getElementById('copy').onclick=async()=>{
    const txt=`Alış-veriş (${dShort(wStart)} – ${dShort(addDays(wStart,6))})\n`+ORDER.filter(g=>groups[g]).map(g=>`\n${g}:\n`+groups[g].map(([c,gr])=>`${bought[c]?'✓':'-'} ${ING[c].n}: ${amount(c,gr)}`).join('\n')).join('\n');
    try{await navigator.clipboard.writeText(txt); toast('Siyahı kopyalandı');}catch(e){toast('Kopyalamaq alınmadı');}
  };
}

function weights(m){ const L=S.log[m.id]||{}; const arr=Object.entries(L).filter(([d,v])=>v.kg).map(([d,v])=>[d,v.kg]).sort((a,b)=>a[0]<b[0]?-1:1); return arr; }
function renderProgress(){
  const m=member(), t=todayISO(), ws=weights(m);

  const lossWk=Math.max(0,(td-tg)*7/7700);
  const toGoal=m.goalW&&curW>m.goalW&&lossWk>0?Math.ceil((curW-m.goalW)/lossWk):null;
  // adherence
  let days=0, full=0; const i0=Math.min(dayIdx(t),PLAN_DAYS*12);
  for(let k=0;k<=i0;k++){ const d=addDays(S.prefs.start,k); const L=getLog(m.id,d); days++; if(MEALS.every(x=>L.e[x])) full++; }
  view.innerHTML=`<div class="stack">
    <h2>${esc(m.name)}: proqres</h2>

      <div class="stat"><b>${fmt1(curW)}</b><span>indiki çəki, kq</span></div>

    </div>
    ${toGoal?`<div class="tipbox">Bu sürətlə <b>${fmt1(m.goalW)} kq</b> hədəfinə təxminən <b>${toGoal} həftəyə</b> (${dShort(addDays(t,toGoal*7))}) çatacaqsınız.</div>`:''}
    <div class="card stack"><b>Çəkini qeyd et</b>
      <div class="grid2"><div><label class="f" for="wd">Tarix</label><input id="wd" type="date" value="${t}"></div><div><label class="f" for="wk">Çəki, kq</label><input id="wk" type="number" step="0.1" min="30" max="300" placeholder="${fmt1(curW)}"></div></div>
      <button class="btn" id="wsave">Yadda saxla</button>
      <p class="tiny muted">Həftədə bir dəfə, eyni gün, səhər ac qarına çəkilin.</p></div>
    <div class="card chart"><b>Çəki: faktiki və proqnoz</b><div id="wc"></div></div>
    <div class="card"><b>Menyuya əməl</b><p class="small" style="margin:6px 0 0">${days?`${days} gündən <b>${full}</b> gündə bütün 4 yemək yerinə yetirilib (${Math.round(full/days*100)}%).`:'Hələ məlumat yoxdur.'}</p></div>
    ${ws.length?`<div class="card"><b>Qeydlər</b><ul class="list">${ws.slice().reverse().map(([d,kg])=>`<li><span>${dLong(d)}</span><span class="row"><b class="num">${fmt1(kg)} kq</b><button class="ic" data-delw="${d}" aria-label="Sil">${ICONS.x}</button></span></li>`).join('')}</ul></div>`:''}
  </div>`;
  document.getElementById('wsave').onclick=()=>{const d=document.getElementById('wd').value, kg=+document.getElementById('wk').value; if(!d||!(kg>30)){toast('Çəkini düzgün yazın');return;} log(m.id,d).kg=kg; if(d>=t){m.w=kg;} save(); renderProgress(); toast('Çəki qeyd olundu');};
  view.querySelectorAll('[data-delw]').forEach(b=>b.onclick=()=>{const L=log(m.id,b.dataset.delw); delete L.kg; save(); renderProgress();});
  drawWeight(m,ws,startW);
}
function drawWeight(m,ws,startW){
  const W=640,H=260,L=40,Rr=16,T=14,B=30, weeks=12, s0=S.prefs.start;
  const proj=[startW]; let cur=startW; const mm={...m};
  for(let k=1;k<=weeks;k++){ mm.w=cur; const tg=target(m); cur=cur-Math.max(0,(tdee(mm)-tg)*7/7700); proj.push(cur); }
  const pts=ws.map(([d,kg])=>[diffDays(s0,d)/7,kg]).filter(p=>p[0]>=-1&&p[0]<=weeks+1);
  const ys=[...proj,...pts.map(p=>p[1]),m.goalW||proj[weeks]];
  const minY=Math.floor(Math.min(...ys)-1), maxY=Math.ceil(Math.max(...ys)+0.5);
  const x=v=>L+(W-L-Rr)*Math.max(0,Math.min(weeks,v))/weeks, y=v=>T+(H-T-B)*(maxY-v)/(maxY-minY||1);
  let g=''; const step=Math.max(1,Math.round((maxY-minY)/5));
  for(let v=minY;v<=maxY;v+=step) g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  for(let k=0;k<=weeks;k+=2) g+=`<text x="${x(k)}" y="${H-10}" text-anchor="middle">${k===0?dShort(s0):k+'. həftə'}</text>`;
  if(m.goalW) g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(m.goalW)}" y2="${y(m.goalW)}" stroke="var(--herb)" stroke-dasharray="3 4"/><text x="${W-Rr}" y="${y(m.goalW)-5}" text-anchor="end" style="fill:var(--herb)">hədəf ${fmt1(m.goalW)}</text>`;
  g+=`<path d="${proj.map((v,k)=>(k?'L':'M')+x(k)+' '+y(v)).join(' ')}" fill="none" stroke="var(--saffron)" stroke-width="2.5" stroke-dasharray="6 5"/>`;
  if(pts.length){ g+=`<path d="${pts.map((p,k)=>(k?'L':'M')+x(p[0])+' '+y(p[1])).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3"/>`; pts.forEach(p=>g+=`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="4" fill="var(--accent)"/>`); }
  document.getElementById('wc').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Çəki qrafiki">${g}</svg><div class="small muted"><span style="color:var(--accent)">●</span> faktiki çəki &nbsp; <span style="color:var(--saffron)">- -</span> proqnoz &nbsp; <span style="color:var(--herb)">- -</span> hədəf</div>`;
}

    <div class="grid2"><div><label class="f" for="mh">Boy, sm</label><input id="mh" type="number" min="130" max="220" value="${m.h}"></div>
      <div><label class="f" for="mw">Çəki, kq</label><input id="mw" type="number" step="0.1" min="35" max="300" value="${m.w}"></div></div>
    <div class="grid2"><div><label class="f" for="mgw">Hədəf çəki, kq</label><input id="mgw" type="number" step="0.1" min="35" max="300" value="${m.goalW||''}"></div>
      <div><label class="f" for="mgo">Məqsəd</label><select id="mgo">${Object.entries(GOALS).map(([k,l])=>`<option value="${k}" ${m.goal===k?'selected':''}>${l}</option>`).join('')}</select></div></div>
    <div><label class="f" for="mac">Həyat tərzi</label><select id="mac">${ACTS.map(([v,l])=>`<option value="${v}" ${+m.act===v?'selected':''}>${l}</option>`).join('')}</select></div>
    <div><span class="f" style="display:block;font-size:.82rem;font-weight:600;margin:4px 0">Sağlamlıq</span>
      <label class="row small" style="cursor:pointer"><input type="checkbox" id="man" ${m.anemia?'checked':''} style="width:20px;height:20px;accent-color:var(--accent)"> Anemiya (dəmir çatışmazlığı)</label>
      <label class="row small" style="cursor:pointer;margin-top:6px"><input type="checkbox" id="mins" ${m.insulin?'checked':''} style="width:20px;height:20px;accent-color:var(--accent)"> İnsulin direnci və ya prediabet</label></div>
    <div class="tipbox small" id="mprev"></div>
    <div class="row" style="flex-wrap:wrap"><button class="btn" type="submit">Yadda saxla</button>${!isNew&&S.members.length>1?'<button class="btn ghost" type="button" id="mdel">Profili sil</button>':''}</div>
  </form>`,(sb,w)=>{
    const read=()=>({...m,name:sb.querySelector('#mn').value.trim(),sex:sb.querySelector('#msx').value,age:+sb.querySelector('#mag').value,h:+sb.querySelector('#mh').value,w:+sb.querySelector('#mw').value,goalW:+sb.querySelector('#mgw').value||null,goal:sb.querySelector('#mgo').value,act:+sb.querySelector('#mac').value,anemia:sb.querySelector('#man').checked,insulin:sb.querySelector('#mins').checked});
    const prev=()=>{const x=read(); if(!(x.age>0&&x.h>0&&x.w>0)) return; const b=bmi(x), tg=target(x), td=tdee(x);
      sb.querySelector('#mprev').innerHTML=`Gündəlik xərc: <b>${fmt(td)} kkal</b> · Hədəf: <b>${fmt(tg)} kkal</b> · BMI: <b>${fmt1(b)}</b>${td-tg>100?` · ~${fmt1((td-tg)*7/7700)} kq/həftə`:''}${x.age<18?'<br>18 yaşdan kiçiklər üçün yalnız yüngül rejim tətbiq olunur, həkimlə məsləhətləşin.':''}${b<20&&(x.goal==='lose'||x.goal==='light')?'<br>BMI artıq aşağıdır: arıqlamaq tövsiyə olunmur.':''}`;};
    sb.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',prev)); prev();
    sb.querySelector('#mf').onsubmit=e=>{e.preventDefault(); const x=read(); if(!x.name){toast('Adı yazın');return;}
      if(isNew){ x.startW=x.w; S.members.push(x); S.active=x.id; } else { Object.assign(m,x); }
      if(!S.plan) generate(); ADJ_CACHE.clear(); save(); closeSheet(w); toast('Profil yadda saxlandı'); };
    const del=sb.querySelector('#mdel'); if(del) del.onclick=()=>{ S.members=S.members.filter(z=>z.id!==m.id); delete S.log[m.id]; S.active=S.members[0].id; save(); closeSheet(w); };
  });
}
async function downloadICS(){
  const p=S.prefs, lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Sufre//AZ','CALSCALE:GREGORIAN'];
  const t=todayISO(); const i0=Math.max(0,dayIdx(t));
  for(let k=0;k<PLAN_DAYS;k++){
    const d=addDays(p.start,i0+k), i=(i0+k)%PLAN_DAYS;
    MEALS.forEach(x=>{ const [h,mm]=p.times[x].split(':'); const dt=d.replace(/-/g,'')+'T'+h+mm+'00';
      const end=d.replace(/-/g,'')+'T'+pad((+h+(+mm>=30?1:0))%24)+pad((+mm+30)%60)+'00';
      lines.push('BEGIN:VEVENT','UID:'+d+x+'@sufre','DTSTAMP:'+t.replace(/-/g,'')+'T000000','DTSTART:'+dt,'DTEND:'+end,'SUMMARY:'+MEALS_SHORT[x]+': '+R[S.plan[i][x]].name.replace(/[,;]/g,' '),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+MEALS_SHORT[x]+' vaxtıdır','TRIGGER:-PT10M','END:VALARM','END:VEVENT'); });
  }
  lines.push('END:VCALENDAR');
  const ok=await saveFile('sufre-menyu.ics',lines.join('\r\n'),'text/calendar'); toast(ok?'Faylı açın və təqviminizə əlavə edin':'Yükləmə ləğv olundu');
}

/* ================= files (standalone + Claude) ================= */
const STANDALONE=!(window.claude&&window.claude.use);
async function saveFile(filename,data,mime){
  if(DL){ try{ await DL.save({filename,data}); return true; }catch(e){ return false; } }
  if(STANDALONE){ try{ const url=URL.createObjectURL(new Blob([data],{type:mime||'application/octet-stream'})); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); return true; }catch(e){ return false; } }
  return false;
}
function exportBackup(){
  const data=JSON.stringify({app:'sufre',v:1,state:S,photos:PH});
  saveFile('sufre-ehtiyat-'+todayISO()+'.json',data,'application/json').then(ok=>{
    if(ok) toast('Ehtiyat faylı yükləndi');
    else navigator.clipboard.writeText(data).then(()=>toast('Ehtiyat məlumatı kopyalandı'),()=>toast('Ehtiyat nüsxə alınmadı'));
  });
}
function importBackup(file){
  const fr=new FileReader();
  fr.onload=()=>{ try{ const j=JSON.parse(fr.result); if(j.app!=='sufre'||!j.state||j.state.v!==1) throw 0; S=j.state; PH=j.photos||{}; migrate(); try{localStorage.setItem(LSP,JSON.stringify(PH));}catch(e){} ADJ_CACHE.clear(); save(); tab='today'; render(); toast('Məlumatlar bərpa olundu'); }catch(e){ toast('Bu fayl Süfrə ehtiyat faylı deyil'); } };
  fr.readAsText(file);
}

/* ================= boot ================= */
const h=(location.hash||'').slice(1); if(TABS.some(t=>t[0]===h)) tab=h;
if(S.members.length&&!S.active) S.active=S.members[0].id;
render();
// re-render at midnight / when app becomes visible (date may change)
let lastDay=todayISO();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&todayISO()!==lastDay){ lastDay=todayISO(); if(!sheetStack.length) render(); } });
setInterval(()=>{ if(todayISO()!==lastDay){ lastDay=todayISO(); if(!sheetStack.length) render(); } else if(tab==='today'&&!sheetStack.length&&!document.hidden){ /* refresh "next meal" */ const v=view.scrollTop; render(); view.scrollTop=v; } },300000);
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user,dl,sample]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads'),claude.use('sample')]);
    DL=dl||null;
    if(sample){ SAMPLE=sample; try{const l=await sample.limits(); SAMPLE_IMG=!!(l&&l.images);}catch(e){SAMPLE_IMG=false;} }
    if(db&&user){
      const id=await user.id();
      if(id){
        DB=db; UID=id;
        const timer=setTimeout(()=>{syncNote='Hesabla sinxronizasiya hələ cavab vermir. Məlumatlar bu cihazda saxlanılır.';},10000);
        try{
          const snap=await db.doc('data/users/'+id+'/state').get();
          clearTimeout(timer);
          if(snap.exists){ const d=snap.data(); const remote=d&&d.json?JSON.parse(d.json):null;
            if(remote&&remote.v===1&&(remote.updated||0)>(S.updated||0)){ S=remote; try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} ADJ_CACHE.clear(); }
            else if((S.updated||0)>(d.t||0)) save();
          } else if(S.members.length) save();
          syncNote='Məlumatlar Claude hesabınızda saxlanılır: telefonda və kompüterdə eyni profillər və qeydlər görünür.';
        }catch(e){ clearTimeout(timer); syncNote='Hesabla sinxronizasiya alınmadı. Məlumatlar bu cihazda saxlanılır.'; }
      }
    }
    if(!sheetStack.length) render();
  }catch(e){}
})();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
})();
</script>
