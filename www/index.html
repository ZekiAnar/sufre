<!DOCTYPE html>
<html lang="az">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Süfrə</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
/* Layout idea: a phone-first app shell — header, one scrolling view, bottom tab bar; sheets slide up for a day or a recipe. */
:root{
  --bg:#f6f4f1; --surface:#ffffff; --ink:#1f2328; --muted:#5f6670; --line:#e3ded7;
  --accent:#a3263b; --saffron:#d99a1e; --herb:#3d7a4c; --sky:#2f6690;
  --accent-soft:#f5e3e6; --herb-soft:#e4efe6; --saffron-soft:#f8ecd2; --sky-soft:#e1ecf4;
  --good:#3d7a4c; --warn:#b7791f;
  --display:"Noto Serif", Georgia, serif;
  --body:"Noto Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --r:14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --surface:#1e2125; --ink:#eceae6; --muted:#a2a8b0; --line:#30353b;
    --accent:#e0566c; --saffron:#e8b04a; --herb:#6dbb80; --sky:#6aa6d6;
    --accent-soft:#3a2026; --herb-soft:#1f3326; --saffron-soft:#3a2f18; --sky-soft:#1c2a36;
    --good:#6dbb80; --warn:#e8b04a; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --surface:#1e2125; --ink:#eceae6; --muted:#a2a8b0; --line:#30353b;
  --accent:#e0566c; --saffron:#e8b04a; --herb:#6dbb80; --sky:#6aa6d6;
  --accent-soft:#3a2026; --herb-soft:#1f3326; --saffron-soft:#3a2f18; --sky-soft:#1c2a36;
  --good:#6dbb80; --warn:#e8b04a; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.5rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
a{color:var(--accent)}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;background:var(--bg)}
header.bar{padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:var(--bg)}
header.bar .brand{font-family:var(--display);font-weight:700;font-size:1.2rem;color:var(--accent);margin-right:auto}
.who{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.who::-webkit-scrollbar{display:none}
.who button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;white-space:nowrap;cursor:pointer}
.who button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
nav.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button:focus-visible,.btn:focus-visible,.chip:focus-visible,.ic:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.num{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{white-space:nowrap}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px}
.p-S{background:var(--saffron-soft)} .p-N{background:var(--herb-soft)} .p-D{background:var(--sky-soft)} .p-Q{background:var(--accent-soft)}
.ic{border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted)}
/* today */
.hero{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.ring{position:relative;width:120px;height:120px}
.ring svg{width:120px;height:120px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.1}
.datebig{font-family:var(--display);font-size:1.35rem;font-weight:700}
.meal{display:grid;grid-template-columns:auto 56px 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.meal.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.meal.done .mt{text-decoration:line-through;color:var(--muted)}
.meal .art{width:56px;height:44px} .meal .art svg{width:56px;height:44px}
.meal .mt{font-weight:600;line-height:1.25;cursor:pointer}
.meal .ms{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.check[aria-checked="true"]{background:var(--good);border-color:var(--good);color:#fff}
.water{display:flex;gap:6px;flex-wrap:wrap}
.water button{width:30px;height:38px;border:2px solid var(--sky);border-radius:4px 4px 9px 9px;background:transparent;cursor:pointer;padding:0;position:relative;overflow:hidden}
.water button[aria-pressed="true"]{background:var(--sky)}
.tipbox{border-left:4px solid var(--saffron);background:var(--saffron-soft);border-radius:8px;padding:10px 12px;font-size:.92rem}
.warnbox{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
/* calendar */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wkh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;font-size:.7rem;color:var(--muted);text-align:center;font-weight:600;margin-bottom:4px}
.dc{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 4px;min-height:64px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:.72rem;position:relative}
.dc .dn{font-weight:700;font-size:1rem;font-variant-numeric:tabular-nums}
.dc.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.dc.past{opacity:.7}
.dc.out{visibility:hidden}
.dc .dots{display:flex;gap:2px}
.dc .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dc .dots i.on{background:var(--good)}
.mlabel{font-family:var(--display);font-weight:700;margin:14px 0 8px}
/* recipes */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rc{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.rc .im{background:var(--bg);display:flex;justify-content:center;padding:6px 0;height:96px;align-items:center}
.rc .im svg{width:110px;height:80px} .rc .im img{width:100%;height:96px;object-fit:cover}
.rc .tx{padding:8px 10px}
.rc .tx b{display:block;font-size:.9rem;line-height:1.25}
.nat{color:var(--accent)}
.cu{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.04em;padding:1px 5px;border-radius:5px;color:#fff;background:var(--cu);vertical-align:middle}
input[type=search],input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
label.f{display:block;font-size:.82rem;font-weight:600;margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* sheet */
.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet .sh h2{flex:1;font-size:1.1rem}
.sheet .sb{overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
.hero-img{border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;justify-content:center;align-items:center;min-height:150px;overflow:hidden}
.hero-img svg{width:200px;height:146px} .hero-img img{width:100%;max-height:260px;object-fit:cover}
table.ing{width:100%;border-collapse:collapse;font-size:.92rem}
table.ing td{padding:6px 0;border-bottom:1px dashed var(--line);vertical-align:top}
table.ing td.g{text-align:right;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:10px}
ol.steps{padding-left:0;list-style:none;margin:0;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
ol.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.85rem}
ol.steps li.done{color:var(--muted);text-decoration:line-through}
ol.steps li.done::before{background:var(--good);color:#fff;content:"✓"}
.macros{display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-size:.9rem}
.macros b{font-weight:700}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:center}
ul.list{list-style:none;margin:0;padding:0}
.list li.got span:first-child{text-decoration:line-through;color:var(--muted)}
.gchk{width:20px;height:20px;accent-color:var(--good);margin-right:8px;flex:none}
.list input[type=checkbox]{width:20px;height:20px;accent-color:var(--good);margin-right:8px;flex:none}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.9rem;z-index:50;max-width:90%}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.member{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.sec{margin-top:18px}
.welcome{max-width:520px;margin:20px auto;text-align:center}
.welcome h1{font-size:2rem;color:var(--accent)}
details summary{cursor:pointer;font-weight:600}
.alt{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.alt svg{width:56px;height:44px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.hb{color:var(--ink);flex:none}
.hb[aria-pressed="true"]{color:var(--accent)}
.sheet .sh{position:relative;touch-action:none}
.sheet .grab{position:absolute;top:5px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--line)}
.card.ram{background:linear-gradient(135deg,#1e2a4a,#3b2f63);color:#fff;border:none}
.card.ram .tiny{color:#d9d4f0;display:block}
.ramt{display:flex;gap:22px;margin-top:8px}
.ramt b{font-size:1.35rem}
.micros{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.86rem}
.micros .mc b{font-variant-numeric:tabular-nums}
.micros .mc.lo b{color:var(--saffron)}
.micros .mc.ok b{color:var(--good)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.lnk{background:none;border:none;padding:2px 0;color:var(--accent);font:inherit;font-size:.82rem;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.sheet-wrap.cookwrap .sheet{height:100%;max-height:100%;border-radius:0}
.cook .timers{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cook .tm{border:none;border-radius:999px;padding:6px 12px;background:var(--saffron);color:#fff;font:inherit;font-weight:700;font-variant-numeric:tabular-nums}
.cook .tm.done{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.ckstep{display:flex;flex-direction:column;gap:14px;min-height:60vh}
.cktext{position:relative;flex:1;display:flex;align-items:center}
.cktext p{font-size:1.55rem;line-height:1.45;margin:0;padding:10px 4px;cursor:pointer;position:relative;z-index:1}
.cktext .zone{position:absolute;top:0;bottom:0;width:22%;z-index:2}
.cktext .zone.l{left:-10px}.cktext .zone.r{right:-10px}
.btn.big{padding:16px 22px;font-size:1.05rem}
.cookl li{font-size:1.05rem}
.famcode{font-size:2rem;font-weight:800;letter-spacing:.18em;text-align:center;font-variant-numeric:tabular-nums;color:var(--accent);padding:6px 0}
.water-toast{bottom:auto;top:calc(70px + env(safe-area-inset-top));text-align:center;padding:12px 16px;min-width:260px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <button class="ic hb" id="hback" style="display:none"></button>
    <span class="brand">Süfrə</span>
    <div class="who" id="who" role="group"></div>
    <button class="ic hb" id="gear"></button>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" id="tabs" ></nav>
</div>

function trendSeries(m){
  const ws=weights(m); if(!ws.length) return [];
  const out=[], end=todayISO(); let d=ws[0][0], k=0, ema=ws[0][1];
  while(diffDays(d,end)>=0&&out.length<800){
    while(k<ws.length-1&&ws[k+1][0]<=d) k++;
    let w=ws[k][1]; if(ws[k][0]<d&&k<ws.length-1){ const a=ws[k],b=ws[k+1]; w=a[1]+(b[1]-a[1])*diffDays(a[0],d)/diffDays(a[0],b[0]); }
    ema+=0.1*(w-ema); out.push([d,ema]); d=addDays(d,1);
  }
  return out;
}
// MacroFactor-style: real expenditure = average intake − (trend change × 7700); target moves at most 150 kcal per week
function checkIn(m){
  if(m.adapt===false) return null;
  const t=todayISO(); if(m.ciDate&&diffDays(m.ciDate,t)<7) return null;
  if(weights(m).length<3) return null;
  const tr=trendSeries(m); if(tr.length<15) return null;
  const N=Math.min(21,tr.length-1), slope=(tr[tr.length-1][1]-tr[tr.length-1-N][1])/N;
  let sum=0,cnt=0; for(let k=1;k<=N;k++){ const d=addDays(t,-k), Lg=getLog(m.id,d); if(Object.values(Lg.e||{}).some(Boolean)||(Lg.x||[]).length){ sum+=eatenK(m,d); cnt++; } }
  const intake=cnt>=7?sum/cnt:target(m), est=intake-slope*7700, cur=+m.tOff||0;
  const want=Math.max(-600,Math.min(600,est-tdee(m))), next=Math.round(cur+Math.max(-150,Math.min(150,want-cur)));
  return {rate:slope*7,est:Math.round(est),logged:cnt,next,oldT:target(m),newT:target({...m,tOff:next})};
}

      <button class="check" role="checkbox" aria-checked="${!!Lg.e[x]}" data-eat="${x}" aria-label="${esc(mealN(x,fast)+' '+T('eaten'))}">${Lg.e[x]?ICONS.ok:''}</button>
      <div class="art">${photoOrArt(r)}</div>
      <div><span class="pill p-${x}">${tms[x]} · ${esc(mealS(x,fast))}</span>${day[x+'_L']?` <span class="pill">♻ ${esc(T('leftover'))}</span>`:''}<div class="mt" data-r="${r.code}">${esc(rn(r))}</div><div class="ms">${fmt(a.k*di.f)} ${T('kcal')} · ${r.min} ${T('min')}</div>
        ${(x==='N'||x==='D')&&r.batch&&!day[x+'_L']?`<button class="lnk" data-left="${x}">♻ ${esc(T('leftTomorrow'))}</button>`:''}</div>
      ${code==='RIF'?'<span></span>':`<button class="btn plain sm" data-swap="${x}">${esc(T('change'))}</button>`}</div>`;}).join('')}
    <p class="tiny muted">${esc(T('dayHint'))}</p>
  </div>`,(sb,wrap)=>{

function swapMeal(date,x,parent){
  const m=member(), p=pref(date), P=p.P, i=p.i, cur=P[i][x], dcu=P[i].cu, fast=fasting(m,date);
  const alts=D.rec.filter(r=>r.meal===x&&r.code!==cur&&okExcl(r)).sort((a,b)=>((a.cu===dcu||a.cu==='all')?0:1)-((b.cu===dcu||b.cu==='all')?0:1)||Math.abs(adj(a.code,m).k-adj(cur,m).k)-Math.abs(adj(b.code,m).k-adj(cur,m).k));
  openSheet(T('altFor',{m:mealS(x,fast)}),`<div class="stack">${alts.map(r=>`<button class="alt" data-c="${r.code}"><span>${photoOrArt(r)}</span><span>${cuTag(r.cu)} <b>${esc(rn(r))}</b><br><span class="small muted">${fmt(adj(r.code,m).k)} ${T('kcal')} (${esc(T('basePortion'))}) · ${r.min} ${T('min')}</span></span><span class="muted">›</span></button>`).join('')}</div>`,(sb,w)=>{

  });
}

function registerCustom(){
  for(let k=D.rec.length-1;k>=0;k--) if(D.rec[k].own){ delete R[D.rec[k].code]; D.rec.splice(k,1); }
  Object.keys(ING).forEach(c=>{ if(ING[c].own) delete ING[c]; });
  (S.cing||[]).forEach(x=>{ ING[x.code]={n:x.n,k:+x.k||0,p:+x.p||0,f:+x.f||0,c:+x.c||0,fe:0,fb:0,na:0,g:'Yağ və digər',own:1,tr:[x.n,x.n]}; });
  (S.custom||[]).forEach(r=>{ const q={...r,own:1,cu:'own',nat:0,tip:r.tip||''}; q.ing=q.ing.filter(([c])=>ING[c]); D.rec.push(q); R[q.code]=q; });
  ADJ_CACHE.clear();
}

/* ================= cooking mode ================= */
const COOK_TIMERS=[]; let cookTick=null, wakeLock=null;
function stepMinutes(s){ const t=String(s).toLowerCase(); let m=t.match(/(\d+)\s*[–-]\s*(\d+)\s*(dəqiqə|dəq|мин|min|saat|час|hour)/); if(m) return (+m[2])*(/saat|час|hour/.test(m[3])?60:1);
  m=t.match(/(\d+(?:[.,]5)?)\s*(dəqiqə|dəq|мин|min|saat|час|hour)/); if(m) return Math.round(parseFloat(m[1].replace(',','.'))*(/saat|час|hour/.test(m[2])?60:1)); return 0; }
function beep(){ try{ const A=new (window.AudioContext||window.webkitAudioContext)(); [0,0.35,0.7].forEach(t=>{ const o=A.createOscillator(), g=A.createGain(); o.frequency.value=880; o.connect(g); g.connect(A.destination); g.gain.setValueAtTime(0.3,A.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001,A.currentTime+t+0.3); o.start(A.currentTime+t); o.stop(A.currentTime+t+0.3); }); }catch(e){} try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300]);}catch(e){} }
async function keepAwake(on){
  try{ const K=CP().KeepAwake; if(NATIVE&&K){ on?await K.keepAwake():await K.allowSleep(); return; } }catch(e){}
  try{ if(on&&navigator.wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); } else if(!on&&wakeLock){ await wakeLock.release(); wakeLock=null; } }catch(e){}
}
function startTimer(label,min){
  const id=Date.now()%100000, end=Date.now()+min*60000; COOK_TIMERS.push({id,label,end});
  if(NATIVE){ try{ CP().LocalNotifications.schedule({notifications:[{id:9000+id%900,title:'⏱ '+T('timerDone'),body:label,schedule:{at:new Date(end),allowWhileIdle:true}}]}); }catch(e){} }
  if(!cookTick) cookTick=setInterval(tickTimers,1000); tickTimers();
}
function stopTimer(id){ const k=COOK_TIMERS.findIndex(t=>t.id===id); if(k>=0){ COOK_TIMERS.splice(k,1); if(NATIVE){ try{CP().LocalNotifications.cancel({notifications:[{id:9000+id%900}]});}catch(e){} } } tickTimers(); }
function tickTimers(){
  const now=Date.now();
  COOK_TIMERS.slice().forEach(t=>{ if(t.end<=now&&!t.done){ t.done=1; beep(); toast('⏱ '+T('timerDone')+': '+t.label); setTimeout(()=>stopTimer(t.id),8000); } });
  document.querySelectorAll('.timers').forEach(el=>{ el.innerHTML=COOK_TIMERS.map(t=>{const s=Math.max(0,Math.round((t.end-now)/1000)); return `<button class="tm ${t.done?'done':''}" data-tstop="${t.id}" title="${esc(T('timerStop'))}">⏱ ${Math.floor(s/60)}:${pad(s%60)} · ${esc(t.label.slice(0,24))} ✕</button>`;}).join(''); el.querySelectorAll('[data-tstop]').forEach(b=>b.onclick=e=>{e.stopPropagation(); stopTimer(+b.dataset.tstop);}); });
  if(!COOK_TIMERS.length&&cookTick){ clearInterval(cookTick); cookTick=null; }
}
function openCook(code,scope,rows,steps){
  const r=R[code], n=steps.length; let pg=0; const got={};
  keepAwake(true);
  const w=openSheet(rn(r),`<div class="cook"><div class="timers"></div><div id="ckb"></div></div>`,(sb,wr)=>{ wr.classList.add('cookwrap'); });
  const body=w.querySelector('#ckb');
  const obs=new MutationObserver(()=>{ if(!document.body.contains(w)){ keepAwake(false); obs.disconnect(); } }); obs.observe(document.getElementById('sheet-root'),{childList:true});
  const draw=()=>{
    if(pg===0){ body.innerHTML=`<div class="stack"><h3>${esc(T('cookPrep'))}</h3><p class="small muted" style="margin:0">${esc(T(scope==='fam'?'cookFam':'cookMe'))}</p>
      <ul class="list cookl">${rows.map(([c,g])=>`<li class="${got[c]?'got':''}"><label class="row" style="flex:1;cursor:pointer"><input type="checkbox" data-cg="${c}" ${got[c]?'checked':''}><span>${esc(inm(c))}</span></label><b class="num">${c==='yumurta'?Math.max(1,Math.round(g/55))+' '+T('pcs'):r5(g)+' '+T('g')}</b></li>`).join('')}</ul>
      <button class="btn big" data-nav="1">${esc(T('cookGo'))} ›</button></div>`;
      body.querySelectorAll('[data-cg]').forEach(cb=>cb.onchange=()=>{got[cb.dataset.cg]=cb.checked; cb.closest('li').classList.toggle('got',cb.checked);});
    } else if(pg<=n){ const s=steps[pg-1], mins=stepMinutes(r.steps[pg-1]||s)||stepMinutes(s);
      body.innerHTML=`<div class="ckstep"><div class="small muted">${esc(T('stepOf',{a:pg,b:n}))}</div><div class="bar"><i style="width:${Math.round(pg/n*100)}%"></i></div>
        <div class="cktext" id="cktx"><span class="zone l"></span><p>${esc(s)}</p><span class="zone r"></span></div>
        ${mins?`<button class="btn" id="ctm">⏱ ${esc(T('timerStart',{n:mins}))}</button>`:''}
        <div class="row between cknav"><button class="btn plain big" data-nav="-1">‹ ${esc(T('prev'))}</button><button class="btn big" data-nav="1">${esc(pg===n?T('cookFinish'):T('next'))} ›</button></div>
        <p class="tiny muted" style="text-align:center;margin:0">${esc(T('cookTap'))}</p></div>`;
      const tb=body.querySelector('#ctm'); if(tb) tb.onclick=()=>{ startTimer(rn(r)+' · '+pg,mins); toast(T('timerSet',{n:mins})); };
      body.querySelector('.zone.l').onclick=()=>go(-1); body.querySelector('.zone.r').onclick=()=>go(1); body.querySelector('#cktx p').onclick=()=>go(1);
    } else { const t=todayISO(), m=member(), p=pref(t), f=fasting(m,t), slot=p.i>=0?mealsFor(f).find(x=>slotRec(p.P[p.i],x,f)===code):null;
      body.innerHTML=`<div class="stack" style="text-align:center;padding-top:30px"><div style="font-size:3.5rem">🍽️</div><h2>${esc(T('cookDone'))}</h2>
        ${slot&&!getLog(m.id,t).e[slot]?`<button class="btn" id="ckeat">✓ ${esc(T('cookMark',{m:mealN(slot,f)}))}</button>`:''}
        <button class="btn plain" data-close>${esc(T('close'))}</button></div>`;
      const ce=body.querySelector('#ckeat'); if(ce) ce.onclick=()=>{ log(m.id,t).e[slot]=true; save(); closeSheet(w); toast(T('added')); };
      body.querySelector('[data-close]').onclick=()=>closeSheet(w);
    }
    body.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(+b.dataset.nav));
    tickTimers();
  };
  const go=d=>{ pg=Math.max(0,Math.min(n+1,pg+d)); draw(); };
  draw();
}

function setPhoto(code,file,done){

  };

}

let menuMode=null;
function renderMenu(){
  const m=member(), t=todayISO(), r=ramP(), ramAvail=!!r.on&&hasFaster();
  if(menuMode===null) menuMode=ramAvail&&isRam(t)?'ram':'base';
  if(!ramAvail) menuMode='base';

  if(ram) pref(r.start);
  const start=ram?r.start:addDays(S.prefs.start,Math.floor(Math.max(0,dayIdx(t))/PLAN_DAYS)*PLAN_DAYS);
  const n=ram?ramLen():PLAN_DAYS, end=addDays(start,n-1), ws=S.prefs.weekStart===0?0:1;
  const sd=parseISO(start); const off=(sd.getDay()-ws+7)%7; let cur=addDays(start,-off);
  const hdr=Array.from({length:7},(_,k)=>T('daysShort')[(k+ws)%7]);
  const at=d=>{const p=pref(d); return p.i<0?null:{day:p.P[p.i],ram:p.ram,i:p.i};};
  let html=`<div class="stack">
    ${ramAvail?`<div class="chips"><button class="chip" data-mm="base" aria-pressed="${!ram}">${esc(T('menuTitle'))}</button><button class="chip" data-mm="ram" aria-pressed="${ram}">🌙 ${esc(T('ramMenu'))}</button></div>`:''}
    <div class="row between"><div><h2>${esc(ram?T('ramMenu'):T('menuTitle'))}</h2><div class="small muted">${dShort(start)} – ${dShort(end)}${ram?' · '+esc(CITIES[r.city][0]):''}</div></div><button class="btn plain sm" id="gotoday">${esc(T('today'))}</button></div>
    ${ram?`<p class="tiny muted" style="margin:0">${esc(T('ramMenuNote'))}</p>`:''}
    <div class="wkh">${hdr.map(g=>`<span>${esc(g)}</span>`).join('')}</div>`;
  while(diffDays(cur,end)>=0){
    html+=`<div class="wk">`;

      const d=addDays(cur,k), i=diffDays(start,d);
      if(i<0||i>=n){ html+=`<div class="dc out"></div>`; continue; }
      const x=at(d); if(!x){ html+=`<div class="dc out"></div>`; continue; }
      const Lg=getLog(m.id,d), dd=parseISO(d), fast=fasting(m,d);
      html+=`<button class="dc ${d===t?'today':''} ${diffDays(d,t)>0?'past':''}" data-d="${d}" aria-label="${esc(dLong(d))}">

        <span class="dots">${mealsFor(fast).map(y=>`<i class="${Lg.e[y]?'on':''}"></i>`).join('')}</span></button>`;
    }
    html+=`</div>`; cur=addDays(cur,7);
  }
  html+=`<p class="tiny muted">${esc(T('calHint'))}</p><h3 class="mlabel">${esc(T('dayList'))}</h3><div class="stack">`;
  for(let i=0;i<n;i++){
    const d=addDays(start,i), x=at(d); if(!x) continue;
    const fast=fasting(m,d), tms=timesFor(d,fast,m), di=dayInfo(x.day,m,fast), rt=isRam(d)?ramTimes(d):null;

      <div class="row between"><b>${esc(dLong(d))}</b><span class="small muted num">${cuTag(x.day.cu)} ${esc(x.ram?T('ramDay',{n:x.i+1}):dayN(x.i+1))} · ${fmt(di.k)} ${T('kcal')}</span></div>
      ${rt?`<div class="tiny" style="margin-top:2px">🌙 ${esc(T('imsak'))} <b class="num">${rt.imsak}</b> · ${esc(T('iftar'))} <b class="num">${rt.iftar}</b></div>`:''}
      <div class="small" style="margin-top:4px">${mealsFor(fast).map(y=>`<span class="muted">${tms[y]}</span> ${esc(rn(R[slotRec(x.day,y,fast)]).split(' (')[0])}`).join(' · ')}</div></button>`;
  }
  html+=`</div></div>`;

}

function amount(code,g){
  const kgU=LANG==='ru'?'кг':LANG==='en'?'kg':'kq', lU=LANG==='ru'?'л':'l';
  if(code==='yumurta') return Math.ceil(g/55)+' '+T('pcs');
  if(['sud','kefir'].includes(code)) return fmt1(Math.ceil(g/100)/10)+' '+lU;
  if(g>=1000) return fmt1(Math.ceil(g/100)/10)+' '+kgU;
  return (Math.ceil(g/10)*10)+' '+T('g');
}
function shopGroups(w,scope){
  const tot={}, mem=scope==='me'?[member()]:S.members;
  for(let k=0;k<7;k++){ const d=addDays(w,k), p=pref(d); if(p.i<0) continue; const day=p.P[p.i]; mem.forEach(m=>{const fast=fasting(m,d), di=dayInfo(day,m,fast); mealsFor(fast).forEach(x=>{ if(day[x+'_L']) return; adj(slotRec(day,x,fast),m).ing.forEach(([c,g])=>{tot[c]=(tot[c]||0)+g*di.f;}); });}); }
  const groups={}; Object.entries(tot).forEach(([c,g])=>{if(g<1) return; const gr=ING[c].g; (groups[gr]=groups[gr]||[]).push([c,g]);});
  Object.values(groups).forEach(a=>a.sort((x,y)=>y[1]-x[1]));
  return groups;
}

function itemCost(c,g){ const p=(S.prices||{})[c]; if(!(p>0)) return null; if(c==='yumurta') return Math.ceil(g/55)/10*p; return g/1000*p; }

function drawWeight(m,ws,startW){
  const W=640,H=260,Lx=40,Rr=16,Tp=14,B=30, weeks=12, s0=S.prefs.start;

  const pts=ws.map(([d,kg])=>[diffDays(s0,d)/7,kg]).filter(p=>p[0]>=-1&&p[0]<=weeks+1);
  const ys=[...proj,...pts.map(p=>p[1]),m.goalW||proj[weeks]].map(wOut);
  const minY=Math.floor(Math.min(...ys)-1), maxY=Math.ceil(Math.max(...ys)+0.5);
  const x=v=>Lx+(W-Lx-Rr)*Math.max(0,Math.min(weeks,v))/weeks, y=v=>Tp+(H-Tp-B)*(maxY-wOut(v))/(maxY-minY||1), yr=v=>Tp+(H-Tp-B)*(maxY-v)/(maxY-minY||1);
  let g=''; const step=Math.max(1,Math.round((maxY-minY)/5));
  for(let v=minY;v<=maxY;v+=step) g+=`<line x1="${Lx}" x2="${W-Rr}" y1="${yr(v)}" y2="${yr(v)}" stroke="var(--line)"/><text x="${Lx-6}" y="${yr(v)+4}" text-anchor="end">${v}</text>`;
  for(let k=0;k<=weeks;k+=2) g+=`<text x="${x(k)}" y="${H-10}" text-anchor="middle">${esc(k===0?dShort(s0):T('week',{n:k}))}</text>`;
  if(m.goalW) g+=`<line x1="${Lx}" x2="${W-Rr}" y1="${y(m.goalW)}" y2="${y(m.goalW)}" stroke="var(--herb)" stroke-dasharray="3 4"/><text x="${W-Rr}" y="${y(m.goalW)-5}" text-anchor="end" style="fill:var(--herb)">${esc(T('goal'))} ${fmt1(wOut(m.goalW))}</text>`;
  g+=`<path d="${proj.map((v,k)=>(k?'L':'M')+x(k)+' '+y(v)).join(' ')}" fill="none" stroke="var(--saffron)" stroke-width="2.5" stroke-dasharray="6 5"/>`;
  const trp=trendSeries(m).map(([d,w])=>[diffDays(s0,d)/7,w]).filter(p=>p[0]>=0&&p[0]<=weeks);
  if(trp.length>1) g+=`<path d="${trp.map((p,k)=>(k?'L':'M')+x(p[0])+' '+y(p[1])).join(' ')}" fill="none" stroke="#2f6fde" stroke-width="2.5"/>`;
  if(pts.length){ g+=`<path d="${pts.map((p,k)=>(k?'L':'M')+x(p[0])+' '+y(p[1])).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-opacity=".5"/>`; pts.forEach(p=>g+=`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="4" fill="var(--accent)"/>`); }
  document.getElementById('wc').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T('wChart'))}">${g}</svg><div class="small muted"><span style="color:var(--accent)">●</span> ${esc(T('actual'))} &nbsp; <span style="color:#2f6fde">—</span> ${esc(T('trendW'))} &nbsp; <span style="color:var(--saffron)">- -</span> ${esc(T('forecast'))} &nbsp; <span style="color:var(--herb)">- -</span> ${esc(T('goal'))}</div>`;
}

    <div class="grid2"><div><label class="f" for="mgw">${esc(T('goalW'))}, ${wU()}</label><input id="mgw" type="number" step="0.1" value="${m.goalW?fmt1(wOut(m.goalW)).replace(',','.'):''}"></div>

      <div><label class="f" for="mifs">${esc(T('ifStart'))}</label><input id="mifs" type="time" value="${(m.ifw&&m.ifw.start)||'12:00'}"></div></div>

  </form>`,(sb,w)=>{
    const num=id=>+String(sb.querySelector(id).value).replace(',','.');
    const read=()=>({...m,name:sb.querySelector('#mn').value.trim(),sex:sb.querySelector('#msx').value,age:num('#mag'),h:num('#mh'),w:Math.round(wIn(num('#mw'))*10)/10,goalW:num('#mgw')?Math.round(wIn(num('#mgw'))*10)/10:null,goal:sb.querySelector('#mgo').value,act:+sb.querySelector('#mac').value,hc:[...hc],al:[...al],fast:sb.querySelector('#mfast').checked,adapt:sb.querySelector('#madapt').checked,ifw:+sb.querySelector('#mif').value?{h:+sb.querySelector('#mif').value,start:sb.querySelector('#mifs').value||'12:00'}:null});
    const prev=()=>{const x=read(); if(!(x.age>0&&x.h>0&&x.w>0)) return; const b=bmi(x), tg=target(x), td=tdee(x);
      sb.querySelector('#mprev').innerHTML=`${esc(T('prevDaily'))}: <b>${fmt(td)} ${T('kcal')}</b> · ${esc(T('prevTarget'))}: <b>${fmt(tg)} ${T('kcal')}</b> · ${esc(T('bmi'))}: <b>${fmt1(b)}</b>${td-tg>100?` · ~${fmt1(wOut((td-tg)*7/7700))} ${wU()}/${LANG==='en'?'wk':LANG==='ru'?'нед':'həftə'}`:''}${x.age<18?'<br>'+esc(T('prevMinor')):''}${b<20&&(x.goal==='lose'||x.goal==='light')?'<br>'+esc(T('prevLowBmi')):''}${noDeficit(x)?'<br>'+esc(T('prevPreg')):''}`;};
    sb.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',prev));
    sb.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const k=b.dataset.h; hc.has(k)?hc.delete(k):hc.add(k); if(k==='insulin'&&hc.has('diabetes')) hc.delete('diabetes'); if(k==='diabetes'&&hc.has('insulin')) hc.delete('insulin'); sb.querySelectorAll('[data-h]').forEach(x=>x.setAttribute('aria-pressed',hc.has(x.dataset.h))); prev();});
    sb.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const k=b.dataset.a; al.has(k)?al.delete(k):al.add(k); b.setAttribute('aria-pressed',al.has(k)); prev();});
    sb.querySelector('#msx').addEventListener('change',()=>{ if(sb.querySelector('#msx').value==='m') ['pcos','preg','breast'].forEach(k=>hc.delete(k)); });
    const fw=()=>{ sb.querySelector('#mfastw').style.display=sb.querySelector('#mfast').checked&&fastRisk(read())?'':'none'; };
    sb.querySelectorAll('input,select,button').forEach(el=>el.addEventListener('click',()=>setTimeout(fw,0))); sb.querySelectorAll('input').forEach(el=>el.addEventListener('input',fw));
    prev(); fw();
    const mr=sb.querySelector('#mreset'); if(mr) mr.onclick=()=>{ m.tOff=0; mr.parentNode.remove(); toast(T('saved')); };
    sb.querySelector('#mf').onsubmit=e=>{e.preventDefault(); const x=read(); if(!x.name){toast(T('nameReq'));return;}
      if(!(x.w>30&&x.w<300&&x.h>100&&x.age>=10)){ toast(T('badWeight')); return; }
      if(isNew){ x.startW=x.w; S.members.push(x); S.active=x.id; } else { Object.assign(m,x); }
      if(!S.plan) generate(); else repairPlan(); ADJ_CACHE.clear(); save(); closeSheet(w); toast(T('profileSaved')); };
    const del=sb.querySelector('#mdel'); if(del) del.onclick=()=>{ S.members=S.members.filter(z=>z.id!==m.id); delete S.log[m.id]; S.active=S.members[0].id; ADJ_CACHE.clear(); save(); closeSheet(w); };
  });
}

async function nativeShareFile(filename,data){

  await Share.share({title:filename,files:[r.uri]});

}
async function saveFile(filename,data,mime){
  if(DL){ try{ await DL.save({filename,data}); return true; }catch(e){ return false; } }
  if(NATIVE){ try{ return await nativeShareFile(filename,data); }catch(e){ return false; } }
  if(STANDALONE){ try{ const url=URL.createObjectURL(new Blob([data],{type:mime||'application/octet-stream'})); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); return true; }catch(e){ return false; } }
  return false;
}

const GOOGLE_WEB_CLIENT_ID='101783932566-dt2deuq5ami2n54k2rtjo55da17hfaht.apps.googleusercontent.com'; // Web OAuth client ID from Google Cloud (Android app)
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file';

async function gToken(interactive){
  const SL=CP().SocialLogin;
  if(!slInit) slInit=SL.initialize({google:{webClientId:GOOGLE_WEB_CLIENT_ID,mode:'online'}});
  await slInit;
  if(GA.tok&&GA.exp>Date.now()+60000) return GA.tok;
  if(GA.email){ try{ const r=await SL.getAuthorizationCode({provider:'google'}); if(r&&r.accessToken){ GA.tok=r.accessToken; GA.exp=Date.now()+50*60000; saveGA(); return GA.tok; } }catch(e){} }
  if(!interactive) return null;
  const res=await SL.login({provider:'google',options:{scopes:[DRIVE_SCOPE]}});
  const at=res&&res.result&&res.result.accessToken; if(!at||!at.token) throw new Error('no_token');
  GA={tok:at.token,exp:at.expires?Date.parse(at.expires)||Date.now()+50*60000:Date.now()+50*60000,email:(res.result.profile&&res.result.profile.email)||GA.email||''};
  saveGA(); gNeed=false; return GA.tok;
}
async function gSignOut(){ try{ await CP().SocialLogin.logout({provider:'google'}); }catch(e){} GA={}; saveGA(); S.prefs.autoDrive=false; save(); toast(T('gd_out')); render(); }
async function gHttp(method,url,data,ctype,interactive,retry){
  const tok=await gToken(interactive); if(!tok) throw {code:'auth'};
  const headers={Authorization:'Bearer '+tok}; if(ctype) headers['Content-Type']=ctype;
  const r=await CP().CapacitorHttp.request({method,url,headers,data,responseType:'text'});
  if(r.status===401&&!retry){ GA.tok=null; saveGA(); return gHttp(method,url,data,ctype,interactive,true); }
  if(r.status<200||r.status>=300) throw {code:r.status};
  return typeof r.data==='string'?r.data:JSON.stringify(r.data);
}

function unwrap(p){
  if(p==null) return p;
  if(typeof p==='string'){ try{return JSON.parse(p);}catch(e){return p;} }
  if(Array.isArray(p.content)&&p.content.length&&p.content[0].type==='text'&&!p.files){ const t=p.content.map(c=>c.text||'').join(''); try{return JSON.parse(t);}catch(e){return t;} }
  if(p.structuredContent) return p.structuredContent;
  return p;
}
async function gdCall(tool,input){ const r=await MCP.callTool('Google Drive',tool,input); return unwrap(r&&r.payload!==undefined?r.payload:r); }
function findFiles(o,out=[]){ if(!o||typeof o!=='object') return out; if(Array.isArray(o)){ o.forEach(x=>findFiles(x,out)); return out; } if(o.id&&(o.title||o.name)) out.push(o); else Object.values(o).forEach(v=>findFiles(v,out)); return out; }
function b64utf8(s){ const bin=atob(s.replace(/\s+/g,'')); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); }
function findBackupText(o){
  if(o==null) return null;
  if(typeof o==='string'){ const s=o.trim(); if(s.startsWith('{')&&s.includes('"sufre"')) return s; if(/^[A-Za-z0-9+/=\s]+$/.test(s)&&s.length>40){ try{ const d=b64utf8(s); if(d.includes('"sufre"')) return d; }catch(e){} } return null; }
  if(typeof o==='object'){ if(o.app==='sufre') return JSON.stringify(o); for(const v of Object.values(o)){ const r=findBackupText(v); if(r) return r; } }
  return null;
}

const toMin=s=>{const [h,m]=s.split(':').map(Number); return h*60+m;};
function waterTimes(date){
  const w=S.prefs.waterRem, out=[], step=Math.max(30,+w.every||90);
  if(date&&fasting(member(),date)==='ram'){ // only between iftar and imsak
    const rt=ramTimes(date), endM=Math.min(1425,Math.max(toMin(w.to),rt.ift+240));
    for(let t=rt.ift+30;t<=endM&&out.length<12;t+=Math.max(60,step)) out.push(hm(t));
    out.push(hm(rt.im-60)); return out;
  }
  const a=toMin(w.from), b=toMin(w.to);
  if(!(b>a)) return out;
  for(let t=a;t<=b&&out.length<24;t+=step) out.push(pad(Math.floor(t/60))+':'+pad(t%60));
  return out;
}
const WATER_ID0=7000;
async function applyWaterReminders(feedback){
  const w=S.prefs.waterRem;
  if(!NATIVE){ if(feedback) toast(T(w.on?'wr_saved':'wr_off')); return; }
  const LN=CP().LocalNotifications; if(!LN) return;
  try{
    const pend=await LN.getPending(); const old=(pend.notifications||[]).filter(n=>n.id>=WATER_ID0&&n.id<WATER_ID0+1000).map(n=>({id:n.id}));
    if(old.length) await LN.cancel({notifications:old});
    if(!w.on){ if(feedback) toast(T('wr_off')); return; }
    let perm=await LN.checkPermissions(); if(perm.display!=='granted') perm=await LN.requestPermissions();
    if(perm.display!=='granted'){ toast(T('wr_denied')); return; }
    // dated reminders for the next 14 days (Ramadan days follow iftar–imsak); refreshed every time the app opens
    const list=[], now=Date.now(), body=T('wr_body',{a:0,b:0}).split('.')[0]+'.';
    for(let k=0;k<14;k++){ const d=addDays(todayISO(),k); waterTimes(d).forEach((t,j)=>{ const [h,mm]=t.split(':').map(Number); const at=parseISO(d); at.setHours(h,mm,0,0); if(at.getTime()>now+30000&&j<24) list.push({id:WATER_ID0+k*24+j,title:T('wr_title'),body,schedule:{at,allowWhileIdle:true}}); }); }
    if(list.length) await LN.schedule({notifications:list});
    if(feedback) toast(T('wr_saved'));
  }catch(e){ if(feedback) toast(T('wr_denied')); }
}

  const W=NATIVE&&CP().SufreWidget; if(!W||!S.members.length) return;
  clearTimeout(widgetTimer); widgetTimer=setTimeout(()=>{ try{
    const m=member(), t=todayISO(), p=pref(t), f=fasting(m,t), Lg=getLog(m.id,t);
    let line1='', line2='';
    if(p.i>=0){ const day=p.P[p.i], tms=timesFor(t,f,m), x=nextMeal(t,f)||null;
      line1=x?tms[x]+' · '+mealS(x,f)+': '+rn(R[slotRec(day,x,f)]):T('allDone');
      const st=stepsOf(m,t); line2=fmt(eatenK(m,t))+' / '+fmt(target(m)+stepBonus(m,t))+' '+T('kcal')+(st?' · 👣 '+fmt(st):'');
      if(f==='ram'){ const rt=ramTimes(t); line2+=' · 🌙 '+rt.iftar; } }
    W.update({date:t,title:'Süfrə · '+m.name,line1,line2,stale:T('widgetStale'),plus:T('wr_plus'),wa:Lg.w||0,wb:waterGoal(m)});
  }catch(e){} },400);
}
async function takeWidgetWater(){
  const W=NATIVE&&CP().SufreWidget; if(!W||!S.members.length) return;
  try{ const r=await W.takePending(); if(r&&r.water>0&&r.date){ const l=log(member().id,r.date); l.w=(l.w||0)+r.water; save(); if(!sheetStack.length) render(); } }catch(e){}
}

/* ================= Health Connect (Android): steps and weight ================= */
const HC_=()=>NATIVE&&CP().Health;
const stepsOf=(m,d)=>+((S.log[m.id]||{})[d]||{}).st||0;
// walking above a 5000-step baseline (already in the activity factor) adds ~0.04 kcal per step per 70 kg
function stepBonus(m,d){ const h=S.prefs.health||{}; if(!h.on||!h.bonus) return 0; return Math.round(Math.max(0,stepsOf(m,d)-5000)*0.04*m.w/70); }
let hcLast=0;
async function healthSync(force){
  const H=HC_(), h=S.prefs.health||{}; if(!H||!h.on||!S.members.length) return;
  if(!force&&Date.now()-hcLast<5*60000) return; hcLast=Date.now();
  try{
    const m=member(), start=parseISO(addDays(todayISO(),-6)), end=new Date();
    const r=await H.queryAggregated({dataType:'steps',startDate:start.toISOString(),endDate:end.toISOString(),bucket:'day',aggregation:'sum'});
    let ch=0; (r.samples||[]).forEach(s=>{ const d=iso(new Date(s.startDate)), v=Math.round(+s.value||0), L0=log(m.id,d); if(L0.st!==v){ L0.st=v; ch++; } });
    if(h.weight){ const w=await H.readSamples({dataType:'weight',startDate:parseISO(addDays(todayISO(),-29)).toISOString(),endDate:end.toISOString(),limit:100});
      (w.samples||[]).forEach(s=>{ const d=iso(new Date(s.startDate)), kg=Math.round((+s.value||0)*10)/10, L0=log(m.id,d); if(kg>30&&kg<300&&!L0.kg){ L0.kg=kg; if(d>=todayISO()) m.w=kg; ch++; } }); }
    if(ch){ ADJ_CACHE.clear(); save(); if(!sheetStack.length&&(tab==='today'||tab==='progress')) render(); }
  }catch(e){ if(force) toast(T('hcFail')); }
}
async function healthEnable(on){
  const H=HC_(); S.prefs.health=S.prefs.health||{};
  if(!on){ S.prefs.health.on=false; save(); render(); return; }
  try{
    const a=await H.isAvailable(); if(!a||!a.available){ toast(T('hcMissing')); try{ await H.openHealthConnectSettings(); }catch(e){} render(); return; }
    const read=['steps'].concat(S.prefs.health.weight?['weight']:[]);
    const st=await H.requestAuthorization({read,write:[]});
    if(!st||!(st.readAuthorized||[]).includes('steps')){ toast(T('hcDenied')); S.prefs.health.on=false; save(); render(); return; }
    S.prefs.health.on=true; save(); await healthSync(true); render(); toast(T('hcOn'));
  }catch(e){ toast(T('hcFail')); render(); }
}

/* ================= family sync (Firebase) ================= */
const FIREBASE_CONFIG=null; // {apiKey, authDomain, projectId, appId}: from the Firebase console
const LSF='sufre-family-v1';
let FAM=(()=>{try{return JSON.parse(localStorage.getItem(LSF)||'null');}catch(e){return null;}})();
let fdb=null, fdoc=null, funsub=null, famTimer=null, famStatus='off', famBusy=false;
const canFamily=()=>!!FIREBASE_CONFIG&&STANDALONE;
const saveFAM=()=>{try{ if(FAM) localStorage.setItem(LSF,JSON.stringify(FAM)); else localStorage.removeItem(LSF); }catch(e){}};
const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s);});
async function fbReady(){
  if(fdb) return fdb;
  if(!window.firebase){ await loadScript('vendor/firebase-app-compat.js'); await loadScript('vendor/firebase-auth-compat.js'); await loadScript('vendor/firebase-firestore-compat.js'); }
  if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  try{ await firebase.firestore().enablePersistence({synchronizeTabs:true}); }catch(e){}
  if(!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
  fdb=firebase.firestore(); return fdb;
}
const SHARED_PREFS=['start','cuisines','quick','excl','times','snack','leftovers','ramadan','weekStart'];
// the shared state as flat "leaves": each person's day log, each bought tick and price is its own field, so two phones rarely overwrite each other
function leaves(st){
  const o={}, j=v=>JSON.stringify(v===undefined?null:v);
  o.members=j(st.members); o.plan=j(st.plan); o.rplan=j(st.rplan||null); o.rkey=j(st.rkey||''); o.seed=j(st.seed||1); o.rseed=j(st.rseed||1); o.custom=j(st.custom||[]); o.cing=j(st.cing||[]);
  const sp={}; SHARED_PREFS.forEach(k=>sp[k]=st.prefs[k]); o.prefs=j(sp);
  Object.entries(st.prices||{}).forEach(([c,v])=>o['price|'+c]=j(v));
  Object.entries(st.pantry||{}).forEach(([c,v])=>{ if(v) o['pantry|'+c]='true'; });
  Object.entries(st.bought||{}).forEach(([k,mp])=>Object.entries(mp||{}).forEach(([c,v])=>{ if(v) o['bought|'+k+'|'+c]='true'; }));
  Object.entries(st.log||{}).forEach(([mid,days])=>Object.entries(days||{}).forEach(([d,v])=>o['log|'+mid+'|'+d]=j(v)));
  return o;
}
function applyLeaf(path,val){
  const v=val===undefined?undefined:JSON.parse(val), p=path.split('|');
  switch(p[0]){
    case 'members': if(v) S.members=v; break;
    case 'plan': if(v) S.plan=v; break;
    case 'rplan': S.rplan=v||null; break;
    case 'rkey': S.rkey=v||''; break;
    case 'seed': S.seed=v||1; break;
    case 'rseed': S.rseed=v||1; break;
    case 'custom': S.custom=v||[]; break;
    case 'cing': S.cing=v||[]; break;
    case 'prefs': if(v) Object.assign(S.prefs,v); break;
    case 'price': S.prices=S.prices||{}; if(v==null) delete S.prices[p[1]]; else S.prices[p[1]]=v; break;
    case 'pantry': S.pantry=S.pantry||{}; if(!v) delete S.pantry[p[1]]; else S.pantry[p[1]]=true; break;
    case 'bought': { S.bought=S.bought||{}; const k=p.slice(1,-1).join('|'), c=p[p.length-1]; S.bought[k]=S.bought[k]||{}; if(v) S.bought[k][c]=true; else delete S.bought[k][c]; break; }
    case 'log': { S.log[p[1]]=S.log[p[1]]||{}; if(v==null) delete S.log[p[1]][p[2]]; else S.log[p[1]][p[2]]=v; break; }
  }
}
function pruneBought(){ const lim=addDays(todayISO(),-56); Object.keys(S.bought||{}).forEach(k=>{ if(k.split('|')[0]<lim) delete S.bought[k]; }); }
function famSchedule(){ if(!FAM||!fdoc) return; clearTimeout(famTimer); famTimer=setTimeout(famFlush,1500); }
async function famFlush(){
  if(!FAM||!fdoc||famBusy) return; famBusy=true;
  try{
    pruneBought();
    const cur=leaves(S), last=FAM.last||{}, upd=[];
    for(const k in cur) if(cur[k]!==last[k]) upd.push([k,cur[k]]);
    for(const k in last) if(!(k in cur)) upd.push([k,null]);
    const FV=firebase.firestore.FieldValue, FP=firebase.firestore.FieldPath;
    for(let i=0;i<upd.length;i+=300){
      const chunk=upd.slice(i,i+300), a=[];
      chunk.forEach(([k,v])=>{ a.push(new FP('d',k), v===null?FV.delete():v); });
      a.push(new FP('t'), FV.serverTimestamp());
      await fdoc.update(...a);
      chunk.forEach(([k,v])=>{ if(v===null) delete last[k]; else last[k]=v; });
      FAM.last=last; saveFAM();
    }
    famStatus='ok';
  }catch(e){ famStatus='err'; }
  famBusy=false;
}
function famListen(){
  if(funsub) funsub();
  funsub=fdoc.onSnapshot(snap=>{
    if(!snap.exists){ famStatus='gone'; if(tab==='family') render(); return; }
    if(snap.metadata.hasPendingWrites) return;
    const d=(snap.data()||{}).d||{}, last=FAM.last||{}; let ch=0;
    for(const k in d) if(d[k]!==last[k]){ applyLeaf(k,d[k]); last[k]=d[k]; ch++; }
    for(const k in last) if(!(k in d)){ applyLeaf(k,undefined); delete last[k]; ch++; }
    famStatus='ok';
    if(ch){ FAM.last=last; saveFAM(); migrate(); registerCustom(); ADJ_CACHE.clear();
      if(!S.members.find(x=>x.id===S.active)) S.active=(FAM.me&&S.members.find(x=>x.id===FAM.me))?FAM.me:(S.members[0]||{}).id;
      try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
      if(!sheetStack.length) render(); updateWidget(); }
    else if(tab==='family'&&!sheetStack.length) render();
  },()=>{ famStatus='err'; if(tab==='family'&&!sheetStack.length) render(); });
}
const FAM_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const famCode=()=>Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>FAM_CHARS[b%FAM_CHARS.length]).join('');
async function famCreate(){
  famStatus='busy'; render();
  try{ await fbReady(); pruneBought(); let id, ref;
    for(let k=0;k<5;k++){ id=famCode(); ref=fdb.collection('families').doc(id); const s=await ref.get(); if(!s.exists) break; }
    const d=leaves(S); await ref.set({d,t:firebase.firestore.FieldValue.serverTimestamp()});
    FAM={id,last:d,me:S.active}; saveFAM(); fdoc=ref; famListen(); famStatus='ok'; toast(T('famCreated')); }
  catch(e){ famStatus='err'; toast(T('famFail')); }
  render();
}
async function famJoin(code){
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,''); if(code.length<6){ toast(T('famBadCode')); return; }
  famStatus='busy'; render();
  try{ await fbReady(); const ref=fdb.collection('families').doc(code), s=await ref.get();
    if(!s.exists){ famStatus='off'; toast(T('famNotFound')); render(); return; }
    const d=(s.data()||{}).d||{};
    const go=()=>{ S.log={}; S.bought={}; S.prices={}; S.pantry={}; Object.entries(d).forEach(([k,v])=>applyLeaf(k,v)); migrate(); registerCustom(); ADJ_CACHE.clear();
      S.active=(S.members[0]||{}).id; FAM={id:code,last:{...d},me:null}; saveFAM(); fdoc=ref; save(); famListen(); famStatus='ok'; tab='family'; render(); toast(T('famJoined')); };
    if(S.members.length) confirmBox(T('famJoinConfirm'),go); else go();
  }catch(e){ famStatus='err'; toast(T('famFail')); render(); }
}
function famLeave(){ confirmBox(T('famLeaveConfirm'),()=>{ if(funsub) funsub(); funsub=null; fdoc=null; FAM=null; saveFAM(); famStatus='off'; render(); }); }
async function famStart(){ if(!canFamily()||!FAM) return; try{ await fbReady(); fdoc=fdb.collection('families').doc(FAM.id); famListen(); famSchedule(); }catch(e){ famStatus='err'; } }
function famCard(){
  if(!canFamily()) return '';
  if(!FAM) return `<div class="card stack"><b>👨‍👩‍👧 ${esc(T('famSync'))}</b><p class="small muted" style="margin:0">${esc(T('famIntro'))}</p>
    <button class="btn" id="famNew" ${famStatus==='busy'?'disabled':''}>${famStatus==='busy'?'<span class="spinner"></span> ':''}${esc(T('famCreate'))}</button>
    <div class="row" style="gap:6px"><input id="famCode" type="text" placeholder="${esc(T('famCodePh'))}" autocapitalize="characters" style="flex:1;letter-spacing:.15em"><button class="btn plain" id="famJoinB">${esc(T('famJoin'))}</button></div></div>`;
  const st={ok:T('famOk'),err:T('famErr'),busy:T('famBusy'),gone:T('famGone'),off:T('famBusy')}[famStatus]||'';
  return `<div class="card stack"><b>👨‍👩‍👧 ${esc(T('famSync'))}</b>
    <div class="famcode">${FAM.id.replace(/(.{4})/,'$1 ')}</div><p class="small muted" style="margin:0;text-align:center">${esc(T('famCodeNote'))}</p>
    <div class="row" style="justify-content:center;flex-wrap:wrap"><button class="btn plain sm" id="famShare">${esc(T('famShare'))}</button><button class="btn ghost sm" id="famOut">${esc(T('famLeave'))}</button></div>
    <div>${lbl(T('famMe'))}<div class="chips">${S.members.map(x=>`<button class="chip" data-me="${x.id}" aria-pressed="${FAM.me===x.id}">${esc(x.name)}</button>`).join('')}</div></div>
    <p class="tiny ${famStatus==='err'||famStatus==='gone'?'':'muted'}" style="margin:0">${famStatus==='ok'?'🟢':famStatus==='err'||famStatus==='gone'?'🔴':'🟡'} ${esc(st)}</p></div>`;
}
function bindFamCard(){
  const n=document.getElementById('famNew'); if(n) n.onclick=famCreate;
  const j=document.getElementById('famJoinB'); if(j) j.onclick=()=>famJoin(document.getElementById('famCode').value);
  const o=document.getElementById('famOut'); if(o) o.onclick=famLeave;
  const sh=document.getElementById('famShare'); if(sh) sh.onclick=async()=>{ const txt=T('famShareText',{c:FAM.id}); try{ if(NATIVE&&CP().Share) await CP().Share.share({text:txt}); else if(navigator.share) await navigator.share({text:txt}); else { await navigator.clipboard.writeText(txt); toast(T('copied')); } }catch(e){} };
  document.querySelectorAll('[data-me]').forEach(b=>b.onclick=()=>{ FAM.me=b.dataset.me; saveFAM(); S.active=FAM.me; try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} render(); updateWidget(); });
}

/* ================= boot ================= */
registerCustom();
renderTabs();
const h0=(location.hash||'').slice(1); if(VIEWS.includes(h0)&&h0!=='today'){ tab=h0; }
if(S.members.length&&!S.active) S.active=S.members[0].id;
if(FAM&&FAM.me&&S.members.find(x=>x.id===FAM.me)) S.active=FAM.me;
render(); syncGuard(); snapshot(); applyWaterReminders(false); famStart(); takeWidgetWater(); updateWidget(); healthSync(false); if(NDRIVE) setTimeout(()=>autoDriveBackup(false),3000);
let lastDay=todayISO();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ takeWidgetWater(); healthSync(false); updateWidget(); } if(!document.hidden&&NDRIVE) autoDriveBackup(false); if(!document.hidden&&todayISO()!==lastDay){ lastDay=todayISO(); if(!sheetStack.length) render(); } });
setInterval(()=>{ if(todayISO()!==lastDay){ lastDay=todayISO(); if(!sheetStack.length) render(); } else if(tab==='today'&&!sheetStack.length&&!document.hidden){ const v=view.scrollTop; render(); view.scrollTop=v; } },300000);
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user,dl,sample,mcp]=await Promise.all(['db','user','downloads','sample','mcp'].map(n=>claude.use(n).catch(()=>null)));
    DL=dl||null; MCP=mcp||null;
    if(sample){ SAMPLE=sample; try{const l=await sample.limits(); SAMPLE_IMG=!!(l&&l.images);}catch(e){SAMPLE_IMG=false;} }
    if(db&&user){
      const id=await user.id();
      if(id){
        DB=db; UID=id;
        const timer=setTimeout(()=>{syncNote='sync_wait';},10000);
        try{
          const snap=await db.doc('data/users/'+id+'/state').get();
          clearTimeout(timer);
          if(snap.exists){ const d=snap.data(); const remote=d&&d.json?JSON.parse(d.json):null;
            if(remote&&remote.v===1&&(remote.updated||0)>(S.updated||0)){ S=remote; migrate(); registerCustom(); LANG=S.prefs.lang; applyTheme(); renderTabs(); try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} ADJ_CACHE.clear(); }
            else if((S.updated||0)>(d.t||0)) save();
          } else if(S.members.length) save();
          syncNote='sync_claude';
        }catch(e){ clearTimeout(timer); syncNote='sync_fail'; }
      }
    }
    if(!sheetStack.length) render();
    autoDriveBackup(false);
  }catch(e){}
})();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
})();
