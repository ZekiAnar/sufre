name: Süfrə — Android APK və veb versiya

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Şəkilləri bərpa et (base64 → png)
        run: |
          for f in $(find www assets -name '*.b64'); do base64 -d "$f" > "${f%.b64}"; rm "$f"; done
          ls -la www assets

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK paketləri
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Asılılıqlar
        run: npm install --no-audit --no-fund

      - name: Android layihəsi
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#a3263b' --iconBackgroundColorDark '#a3263b' --splashBackgroundColor '#a3263b' --splashBackgroundColorDark '#a3263b'
          npx cap sync android
          python3 native/patch_android.py
          printf '\nsocialLogin.facebook.include=false\n' >> android/gradle.properties

      - name: APK yığ
        env:
          SUFRE_KEYSTORE: ${{ secrets.SUFRE_KEYSTORE }}
          SUFRE_KEY_PASSWORD: ${{ secrets.SUFRE_KEY_PASSWORD }}
          SUFRE_VCODE: ${{ github.run_number }}
          SUFRE_VNAME: 1.0.${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$SUFRE_KEYSTORE" ] && [ -n "$SUFRE_KEY_PASSWORD" ]; then
            echo "Daimi açarla imzalanır"
            export SUFRE_KS_PATH="$RUNNER_TEMP/sufre.p12"
            echo "$SUFRE_KEYSTORE" | base64 -d > "$SUFRE_KS_PATH"
            cat ../native/signing.gradle >> app/build.gradle
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../Sufre.apk
          else
            echo "::warning::SUFRE_KEYSTORE secret yoxdur — müvəqqəti açarla imzalanır"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Sufre.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Sufre-apk
          path: Sufre.apk

      - name: Buraxılış (Releases) yarat
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Süfrə v1.0.${{ github.run_number }}
          body: |
            Android telefon üçün quraşdırma faylı: **Sufre.apk**.
            Telefonda yükləyin, açın və "Quraşdır" düyməsinə basın. Lazım olsa "Naməlum mənbələrdən quraşdırma"ya icazə verin.
          files: Sufre.apk
          make_latest: true

      - name: Veb versiya (iPhone) — GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          force_orphan: true
