name: Süfrə — Android APK və veb versiya

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Şəkilləri bərpa et (base64 → png)
        run: |
          for f in $(find www assets -name '*.b64'); do base64 -d "$f" > "${f%.b64}"; rm "$f"; done
          ls -la www assets

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Android SDK paketləri
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Asılılıqlar
        run: npm install --no-audit --no-fund

      - name: Android layihəsi
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#a3263b' --iconBackgroundColorDark '#a3263b' --splashBackgroundColor '#a3263b' --splashBackgroundColorDark '#a3263b'
          npx cap sync android

      - name: APK yığ
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Sufre.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sufre-apk
          path: Sufre.apk

      - name: Buraxılış (Releases) yarat
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Süfrə v1.0.${{ github.run_number }}
          body: |
            Android telefon üçün quraşdırma faylı: **Sufre.apk**.
            Telefonda yükləyin, açın və "Quraşdır" düyməsinə basın. Lazım olsa "Naməlum mənbələrdən quraşdırma"ya icazə verin.
          files: Sufre.apk
          make_latest: true

      - name: Veb versiya (iPhone) — GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          force_orphan: true
